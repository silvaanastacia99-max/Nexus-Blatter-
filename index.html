
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NexusBlatter</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#101c25;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:10px;left:10px;z-index:3;width:190px;background:#061522d9;border:1px solid #40eaff;border-radius:12px;padding:10px}
#logo{font-size:19px;font-weight:bold;color:#44edff}
#vidaFundo{height:12px;background:#452d38;border-radius:8px;overflow:hidden;margin-top:5px}
#vida{height:100%;width:100%;background:#37ed77;transition:width .15s}
#info{font-size:13px;margin-top:7px}
#ajuda{font-size:11px;color:#c9e7f4;margin-top:5px}
#controles{position:fixed;inset:0;pointer-events:none;z-index:4}
.grupo{position:absolute;bottom:22px;display:grid;gap:7px;pointer-events:auto}
#mov{left:18px;grid-template-columns:56px 56px 56px}
#acoes{right:18px;grid-template-columns:70px}
.ctrl{width:56px;height:56px;border:1px solid #a6f6ff99;border-radius:15px;background:#092a40dd;color:white;font-size:24px;font-weight:bold;touch-action:none}
.ctrl:active{background:#087b9b}
.vazio{visibility:hidden}
#acoes .ctrl{width:70px;height:70px;border-radius:50%}
#atacar{background:#a82b36e8;border-color:#ffb3b3;font-size:15px}
#reiniciar{background:#086c8a}
#mensagem{position:fixed;z-index:6;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:#03101ad9;padding:24px}
#cartao{width:min(340px,95%);padding:26px 18px;border:2px solid #38edff;border-radius:22px;background:#0b2133;box-shadow:0 0 35px #00cfff44}
#tituloFinal{font-size:30px;font-weight:bold;color:#50f7ff}
#textoFinal{line-height:1.5;margin:14px 0}
#cartao button{padding:14px 24px;border:0;border-radius:12px;background:#00d9f5;color:#001b2a;font-weight:bold;font-size:17px}
@media(min-width:700px){#mov{left:30px}#acoes{right:30px}}
</style>
</head>
<body>

<canvas id="jogo"></canvas>

<div id="hud">
 <div id="logo">NEXUSBLATTER</div>
 <div style="margin-top:7px;font-size:12px">VIDA</div>
 <div id="vidaFundo"><div id="vida"></div></div>
 <div id="info">Pontos: 0 | Inimigos: 5</div>
 <div id="ajuda">Derrote todos os inimigos!</div>
</div>

<div id="controles">
 <div id="mov" class="grupo">
  <button class="ctrl vazio"> </button>
  <button class="ctrl" data-move="up">▲</button>
  <button class="ctrl vazio"> </button>
  <button class="ctrl" data-move="left">◀</button>
  <button class="ctrl" data-move="down">▼</button>
  <button class="ctrl" data-move="right">▶</button>
 </div>
 <div id="acoes" class="grupo">
  <button id="atacar" class="ctrl">ATACAR</button>
  <button id="reiniciar" class="ctrl">NOVO<br>JOGO</button>
 </div>
</div>

<div id="mensagem">
 <div id="cartao">
  <div id="tituloFinal">VITÓRIA!</div>
  <div id="textoFinal">Você venceu!</div>
  <button id="jogarNovamente">JOGAR NOVAMENTE</button>
 </div>
</div>

<script>
(function(){
"use strict";

const canvas=document.getElementById("jogo");
const ctx=canvas.getContext("2d");
const vidaEl=document.getElementById("vida");
const info=document.getElementById("info");
const ajuda=document.getElementById("ajuda");
const mensagem=document.getElementById("mensagem");
const tituloFinal=document.getElementById("tituloFinal");
const textoFinal=document.getElementById("textoFinal");

let W=innerWidth,H=innerHeight;
let jogador,inimigos,pontos,vida,acabou,ultimoTempo,ultimoDano,ultimoAtaque;
let teclas={};
const mapa=100;
const mov={up:false,down:false,left:false,right:false};

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

function distancia(a,b){
 return Math.hypot(a.x-b.x,a.z-b.z);
}

function iniciar(){
 jogador={x:0,z:0};
 inimigos=[];
 pontos=0;
 vida=100;
 acabou=false;
 ultimoTempo=performance.now();
 ultimoDano=0;
 ultimoAtaque=0;

 for(let i=0;i<5;i++){
  let x,z;
  do{
   x=Math.random()*26-13;
   z=Math.random()*26-13;
  }while(Math.hypot(x,z)<7);
  inimigos.push({
   x,z,vida:3,passo:Math.random()*10,
   cor:["#ff4e55","#ffad42","#db56ff","#ff655e","#ffcc42"][i]
  });
 }

 mensagem.style.display="none";
 atualizarHUD();
}

function projetar(x,z,altura=0){
 const dx=x-jogador.x;
 const dz=z-jogador.z;
 const profundidade=18-dz*.65;
 if(profundidade<2)return null;
 const escala=Math.min(700,450/profundidade);
 return {
  x:W/2+dx*escala,
  y:H*.48+dz*escala*.58-altura*escala,
  escala,profundidade
 };
}

function poligono(pontos,cor){
 ctx.fillStyle=cor;
 ctx.beginPath();
 pontos.forEach((p,i)=>{
  if(!p)return;
  if(i===0)ctx.moveTo(p.x,p.y);
  else ctx.lineTo(p.x,p.y);
 });
 ctx.closePath();
 ctx.fill();
}

function linha(a,b,cor,l=1){
 if(!a||!b)return;
 ctx.strokeStyle=cor;
 ctx.lineWidth=l;
 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.stroke();
}

function desenharCenario(){
 const grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,"#80d4ef");
 grad.addColorStop(.42,"#d0e8d8");
 grad.addColorStop(.43,"#527d43");
 grad.addColorStop(1,"#203e2d");
 ctx.fillStyle=grad;
 ctx.fillRect(0,0,W,H);

 // Montanhas no horizonte
 ctx.fillStyle="#668d8b";
 ctx.beginPath();
 ctx.moveTo(0,H*.45);
 for(let x=0;x<=W+80;x+=80){
  ctx.lineTo(x,H*.30+Math.sin(x*.018)*35+Math.cos(x*.043)*15);
 }
 ctx.lineTo(W,H*.5);
 ctx.lineTo(0,H*.5);
 ctx.fill();

 // Terreno
 poligono([
  projetar(-mapa,0),projetar(mapa,0),
  projetar(mapa,-mapa),projetar(-mapa,-mapa)
 ].filter(Boolean),"#548443");

 // Linhas do mapa
 for(let i=-mapa;i<=mapa;i+=4){
  linha(projetar(i,-mapa),projetar(i,mapa),"#b5db8755",1);
  linha(projetar(-mapa,i),projetar(mapa,i),"#b5db8755",1);
 }

 // Estruturas e pedras
 for(let i=0;i<18;i++){
  let x=Math.sin(i*91+7)*35;
  let z=Math.cos(i*47+4)*35;
  if(Math.hypot(x-jogador.x,z-jogador.z)<4)continue;
  const p=projetar(x,z);
  if(!p||p.x<-100||p.x>W+100)continue;
  const s=p.escala;
  if(i%3===0){
   ctx.fillStyle="#66533e";
   ctx.fillRect(p.x-1*s,p.y-8*s,2*s,8*s);
   ctx.fillStyle="#23613d";
   ctx.beginPath();
   ctx.arc(p.x,p.y-10*s,5*s,0,Math.PI*2);
   ctx.fill();
   ctx.fillStyle="#39804a";
   ctx.beginPath();
   ctx.arc(p.x-2*s,p.y-12*s,3.5*s,0,Math.PI*2);
   ctx.fill();
  }else{
   poligono([
    {x:p.x-4*s,y:p.y},
    {x:p.x-3*s,y:p.y-3*s},
    {x:p.x+2*s,y:p.y-4*s},
    {x:p.x+5*s,y:p.y-1*s},
    {x:p.x+3*s,y:p.y}
   ],"#777e77");
  }
 }
}

function desenharPessoa(x,z,cor,ehJogador,vidaPessoa){
 const p=projetar(x,z);
 if(!p||p.x<-100||p.x>W+100||p.y<-100||p.y>H+100)return;
 const s=Math.max(.25,Math.min(2,p.escala));
 const r=7*s;

 // Sombra
 ctx.fillStyle="#101a1b88";
 ctx.beginPath();
 ctx.ellipse(p.x,p.y,8*s,3*s,0,0,Math.PI*2);
 ctx.fill();

 // Pernas
 ctx.strokeStyle="#15202b";
 ctx.lineWidth=3*s;
 ctx.lineCap="round";
 ctx.beginPath();
 ctx.moveTo(p.x-2*s,p.y-5*s);
 ctx.lineTo(p.x-3*s,p.y);
 ctx.moveTo(p.x+2*s,p.y-5*s);
 ctx.lineTo(p.x+3*s,p.y);
 ctx.stroke();

 // Corpo
 ctx.fillStyle=ehJogador?"#00d8ef":cor;
 ctx.fillRect(p.x-5*s,p.y-17*s,10*s,12*s);

 // Braços
 ctx.strokeStyle=ehJogador?"#a8f8ff":"#ffd1a8";
 ctx.lineWidth=3*s;
 ctx.beginPath();
 ctx.moveTo(p.x-5*s,p.y-15*s);
 ctx.lineTo(p.x-8*s,p.y-9*s);
 ctx.moveTo(p.x+5*s,p.y-15*s);
 ctx.lineTo(p.x+8*s,p.y-10*s);
 ctx.stroke();

 // Cabeça e cabelo/capacete
 ctx.fillStyle="#d9a77e";
 ctx.beginPath();
 ctx.arc(p.x,p.y-21*s,r*.65,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle=ehJogador?"#132c48":"#4a2020";
 ctx.fillRect(p.x-4*s,p.y-25*s,8*s,3*s);

 if(!ehJogador){
  ctx.fillStyle="#301e20";
  ctx.fillRect(p.x-9*s,p.y-34*s,18*s,3*s);
  ctx.fillStyle="#ffffff";
  ctx.font=`bold ${Math.max(9,10*s)}px Arial`;
  ctx.textAlign="center";
  ctx.fillText("INIMIGO",p.x,p.y-38*s);
  ctx.fillStyle="#431d24";
  ctx.fillRect(p.x-9*s,p.y-31*s,18*s,3*s);
  ctx.fillStyle="#ff4a50";
  ctx.fillRect(p.x-9*s,p.y-31*s,18*s*(vidaPessoa/3),3*s);
 }
}

function desenhar(){
 desenharCenario();

 // Desenhar inimigos distantes primeiro
 const lista=inimigos.slice().sort((a,b)=>b.z-a.z);
 lista.forEach(e=>desenharPessoa(e.x,e.z,e.cor,false,e.vida));

 // Personagem do jogador
 desenharPessoa(jogador.x,jogador.z,"#00d8ef",true,3);

 // Mira
 ctx.strokeStyle="#e8ffff";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(W/2-9,H*.48-18);
 ctx.lineTo(W/2-3,H*.48-18);
 ctx.moveTo(W/2+3,H*.48-18);
 ctx.lineTo(W/2+9,H*.48-18);
 ctx.moveTo(W/2,H*.48-23);
 ctx.lineTo(W/2,H*.48-17);
 ctx.stroke();
}

function atualizarHUD(){
 vidaEl.style.width=Math.max(0,vida)+"%";
 vidaEl.style.background=vida<30?"#ff384c":"#37ed77";
 info.textContent="Pontos: "+pontos+" | Inimigos: "+inimigos.length;
}

function finalizar(vitoria){
 if(acabou)return;
 acabou=true;
 mensagem.style.display="flex";
 tituloFinal.textContent=vitoria?"VITÓRIA!":"FIM DE JOGO";
 tituloFinal.style.color=vitoria?"#50f7ff":"#ff626b";
 textoFinal.textContent=vitoria
  ?"Você derrotou todos os inimigos! Pontuação: "+pontos
  :"Sua vida acabou. Pontuação: "+pontos;
 ajuda.textContent=vitoria?"Todos os inimigos derrotados!":"Tente novamente!";
}

function atacar(){
 if(acabou)return;
 const agora=performance.now();
 if(agora-ultimoAtaque<450)return;
 ultimoAtaque=agora;

 let alvo=null,menor=5;
 for(const e of inimigos){
  const d=distancia(jogador,e);
  if(d<menor){menor=d;alvo=e;}
 }
 if(alvo){
  alvo.vida--;
  ajuda.textContent="Acertou o inimigo!";
  if(alvo.vida<=0){
   inimigos=inimigos.filter(e=>e!==alvo);
   pontos+=100;
   ajuda.textContent="Inimigo derrotado! +100 pontos";
   atualizarHUD();
   if(inimigos.length===0){
    finalizar(true);
    return;
   }
  }
 }else{
  ajuda.textContent="Chegue mais perto para atacar!";
 }
 atualizarHUD();
}

function atualizar(dt,agora){
 if(acabou)return;

 let dx=0,dz=0;
 if(mov.left||teclas.ArrowLeft||teclas.a)dx--;
 if(mov.right||teclas.ArrowRight||teclas.d)dx++;
 if(mov.up||teclas.ArrowUp||teclas.w)dz--;
 if(mov.down||teclas.ArrowDown||teclas.s)dz++;

 if(dx||dz){
  const tam=Math.hypot(dx,dz);
  jogador.x+=dx/tam*dt*7;
  jogador.z+=dz/tam*dt*7;
  jogador.x=Math.max(-mapa/2,Math.min(mapa/2,jogador.x));
  jogador.z=Math.max(-mapa/2,Math.min(mapa/2,jogador.z));
 }

 for(const e of inimigos){
  const d=distancia(jogador,e);
  if(d>1.5){
   e.x+=(jogador.x-e.x)/d*dt*1.15;
   e.z+=(jogador.z-e.z)/d*dt*1.15;
  }else if(agora-ultimoDano>1100){
   vida=Math.max(0,vida-5);
   ultimoDano=agora;
   atualizarHUD();
   if(vida<=0){
    finalizar(false);
    return;
   }
  }
 }
}

let anterior=performance.now();
function loop(agora){
 const dt=Math.min((agora-anterior)/1000,.05);
 anterior=agora;
 atualizar(dt,agora);
 desenhar();
 requestAnimationFrame(loop);
}

document.querySelectorAll("[data-move]").forEach(botao=>{
 const direcao=botao.dataset.move;
 botao.addEventListener("pointerdown",e=>{
  e.preventDefault();
  mov[direcao]=true;
  try{botao.setPointerCapture(e.pointerId)}catch(_){}
 });
 ["pointerup","pointercancel","lostpointercapture"].forEach(tipo=>{
  botao.addEventListener(tipo,e=>{
   e.preventDefault();
   mov[direcao]=false;
  });
 });
});

document.getElementById("atacar").addEventListener("pointerdown",e=>{
 e.preventDefault();
 atacar();
});

document.getElementById("reiniciar").addEventListener("click",iniciar);
document.getElementById("jogarNovamente").addEventListener("click",iniciar);

addEventListener("keydown",e=>{
 teclas[e.key]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(e.key===" "||e.key==="Enter")atacar();
});
addEventListener("keyup",e=>{teclas[e.key]=false});
addEventListener("blur",()=>{
 Object.keys(mov).forEach(k=>mov[k]=false);
 teclas={};
});

iniciar();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
