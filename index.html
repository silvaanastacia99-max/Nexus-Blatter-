<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NexusBlatter</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101c25;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:10px;left:10px;right:10px;color:white;z-index:3;text-shadow:1px 2px 3px #000;pointer-events:none}
#titulo{font-size:21px;font-weight:bold;color:#00eaff}
#vidaFundo{width:170px;height:13px;background:#333;border:1px solid white;border-radius:8px;overflow:hidden;margin-top:5px}
#vida{width:100%;height:100%;background:#21e65b;transition:width .2s}
#info{margin-top:5px;font-size:14px}
#ajuda{font-size:12px;margin-top:4px}
#controles{position:fixed;inset:0;z-index:4;pointer-events:none}
.dpad{position:absolute;bottom:22px;left:15px;display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px 54px;gap:4px}
.ctrl,.acao{border:1px solid #ffffff88;background:#122d40cc;color:white;font-weight:bold;font-size:25px;border-radius:14px;pointer-events:auto;touch-action:none;user-select:none}
.ctrl:active,.acao:active{background:#008da9}
#cima{grid-column:2;grid-row:1}
#esquerda{grid-column:1;grid-row:2}
#baixo{grid-column:2;grid-row:2}
#direita{grid-column:3;grid-row:2}
.acoes{position:absolute;bottom:32px;right:17px;display:flex;flex-direction:column;gap:12px;align-items:center}
.acao{width:78px;height:68px;font-size:15px;background:#9a2a25dd}
#pular{background:#175a9cdd}
#reiniciar{position:fixed;z-index:10;display:none;left:50%;top:60%;transform:translate(-50%,-50%);padding:16px 23px;border:0;border-radius:12px;background:#00dff5;color:#00202b;font-size:18px;font-weight:bold}
#mensagem{position:fixed;z-index:8;display:none;left:0;right:0;top:40%;text-align:center;color:white;font-size:32px;font-weight:bold;text-shadow:0 3px 9px #000;pointer-events:none}
#aviso{position:fixed;bottom:4px;left:0;right:0;text-align:center;font-size:10px;color:#ffffff88;pointer-events:none}
</style>
</head>
<body>
<canvas id="jogo"></canvas>

<div id="hud">
  <div id="titulo">NEXUSBLATTER</div>
  <div>VIDA</div>
  <div id="vidaFundo"><div id="vida"></div></div>
  <div id="info">Pontos: 0 | Inimigos: 5</div>
  <div id="ajuda">Derrote todos os inimigos!</div>
</div>

<div id="controles">
  <div class="dpad">
    <button class="ctrl" id="cima">▲</button>
    <button class="ctrl" id="esquerda">◀</button>
    <button class="ctrl" id="baixo">▼</button>
    <button class="ctrl" id="direita">▶</button>
  </div>
  <div class="acoes">
    <button class="acao" id="atacar">ATACAR</button>
    <button class="acao" id="pular">CORRER</button>
  </div>
</div>

<div id="mensagem"></div>
<button id="reiniciar">JOGAR NOVAMENTE</button>
<div id="aviso">NEXUSBLATTER • Arena de batalha</div>

<script>
(function(){
"use strict";

const canvas=document.getElementById("jogo");
const ctx=canvas.getContext("2d");
const vidaEl=document.getElementById("vida");
const info=document.getElementById("info");
const ajuda=document.getElementById("ajuda");
const mensagem=document.getElementById("mensagem");
const reiniciar=document.getElementById("reiniciar");

let W=0,H=0;
let jogador,inimigos,pontos,vida,acabou,vitoria;
let teclas={};
let correndo=false;
let ultimoAtaque=0;
let ultimoTempo=0;
let danoTempo=0;
const mapa=100;

function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

function iniciar(){
  jogador={x:0,z:0,ang:0};
  inimigos=[];
  pontos=0;
  vida=100;
  acabou=false;
  vitoria=false;
  danoTempo=0;
  ultimoAtaque=0;

  for(let i=0;i<5;i++){
    let x,z;
    do{
      x=Math.random()*26-13;
      z=Math.random()*26-13;
    }while(Math.hypot(x,z)<7);
    inimigos.push({x,z,vida:3,vel:.8+Math.random()*.35,flash:0});
  }

  mensagem.style.display="none";
  reiniciar.style.display="none";
  atualizarHUD();
}
function atualizarHUD(){
  vidaEl.style.width=Math.max(0,vida)+"%";
  vidaEl.style.background=vida<30?"#ff3030":"#21e65b";
  info.textContent="Pontos: "+pontos+" | Inimigos: "+inimigos.length;
}
function terminar(venceu){
  if(acabou)return;
  acabou=true;
  vitoria=venceu;
  mensagem.textContent=venceu?"🏆 VOCÊ VENCEU!":"FIM DE JOGO";
  mensagem.style.display="block";
  reiniciar.style.display="block";
  ajuda.textContent=venceu?"Todos os inimigos foram derrotados!":"Tente novamente!";
}
reiniciar.addEventListener("click",iniciar);

function projetar(x,y,z){
  // Câmera em terceira pessoa, atrás do jogador.
  const camX=jogador.x-Math.sin(jogador.ang)*7;
  const camZ=jogador.z-Math.cos(jogador.ang)*7;
  const dx=x-camX;
  const dz=z-camZ;
  const cos=Math.cos(jogador.ang);
  const sin=Math.sin(jogador.ang);
  const lateral=dx*cos-dz*sin;
  const frente=dx*sin+dz*cos;
  const profundidade=frente+8;
  const escala=H*.85/Math.max(1,profundidade);
  return {
    x:W/2+lateral*escala,
    y:H*.37-y*escala+escala*0.5,
    s:escala,
    d:profundidade
  };
}
function poligono(pontos,cor){
  ctx.fillStyle=cor;
  ctx.beginPath();
  ctx.moveTo(pontos[0].x,pontos[0].y);
  for(let i=1;i<pontos.length;i++)ctx.lineTo(pontos[i].x,pontos[i].y);
  ctx.closePath();
  ctx.fill();
}
function linha(a,b,cor,largura=1){
  ctx.strokeStyle=cor;
  ctx.lineWidth=largura;
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}
function desenharChao(){
  const a=projetar(-mapa,0,-mapa);
  const b=projetar(mapa,0,-mapa);
  const c=projetar(mapa,0,mapa);
  const d=projetar(-mapa,0,mapa);
  poligono([a,b,c,d],"#477c3c");

  for(let i=-mapa;i<=mapa;i+=4){
    linha(projetar(i,0,-mapa),projetar(i,0,mapa),"#b0d17a30");
    linha(projetar(-mapa,0,i),projetar(mapa,0,i),"#b0d17a30");
  }

  // Limite da arena
  const cor="#c6db8b";
  linha(projetar(-mapa,0,-mapa),projetar(mapa,0,-mapa),cor,2);
  linha(projetar(mapa,0,-mapa),projetar(mapa,0,mapa),cor,2);
  linha(projetar(mapa,0,mapa),projetar(-mapa,0,mapa),cor,2);
  linha(projetar(-mapa,0,mapa),projetar(-mapa,0,-mapa),cor,2);
}
function caixa(x,z,tamanho,cor){
  const base=projetar(x,0,z);
  const topo=projetar(x,1.4,z);
  if(base.d<1||base.d>150)return;
  const s=base.s*tamanho;
  ctx.fillStyle="#00000033";
  ctx.beginPath();
  ctx.ellipse(base.x,base.y,s*.7,s*.23,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle=cor;
  ctx.fillRect(topo.x-s*.5,topo.y,s,base.y-topo.y);
  poligono([
    {x:topo.x-s*.5,y:topo.y},
    {x:topo.x-s*.2,y:topo.y-s*.18},
    {x:topo.x+s*.8,y:topo.y-s*.18},
    {x:topo.x+s*.5,y:topo.y}
  ],"#a3b7a5");
}
function arvore(x,z){
  const p=projetar(x,0,z);
  if(p.d<1||p.d>100)return;
  const s=p.s;
  ctx.fillStyle="#553c27";
  ctx.fillRect(p.x-s*.12,p.y-s*1.5,s*.24,s*1.5);
  ctx.fillStyle="#174c30";
  ctx.beginPath();
  ctx.moveTo(p.x,p.y-s*4.3);
  ctx.lineTo(p.x-s*1.1,p.y-s*1.4);
  ctx.lineTo(p.x+s*1.1,p.y-s*1.4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle="#287442";
  ctx.beginPath();
  ctx.moveTo(p.x,p.y-s*3.5);
  ctx.lineTo(p.x-s*.85,p.y-s*.9);
  ctx.lineTo(p.x+s*.85,p.y-s*.9);
  ctx.closePath();
  ctx.fill();
}
function personagem(x,z,cor,ang,vidaInimigo,flash){
  const p=projetar(x,0,z);
  if(p.d<1||p.d>100)return;
  const s=Math.max(2,p.s);
  // Sombra
  ctx.fillStyle="#0006";
  ctx.beginPath();
  ctx.ellipse(p.x,p.y,s*.4,s*.14,0,0,Math.PI*2);
  ctx.fill();

  ctx.save();
  ctx.translate(p.x,p.y);
  const altura=s*1.5;
  const corAtual=flash>0?"#ffffff":cor;
  // Pernas
  ctx.fillStyle="#202a36";
  ctx.fillRect(-s*.28,-altura*.42,s*.22,altura*.42);
  ctx.fillRect(s*.06,-altura*.42,s*.22,altura*.42);
  // Corpo
  ctx.fillStyle=corAtual;
  ctx.fillRect(-s*.35,-altura*.92,s*.7,altura*.55);
  // Braços
  ctx.fillStyle="#c9946c";
  ctx.fillRect(-s*.53,-altura*.86,s*.18,altura*.43);
  ctx.fillRect(s*.35,-altura*.86,s*.18,altura*.43);
  // Cabeça
  ctx.fillStyle="#c9946c";
  ctx.beginPath();
  ctx.arc(0,-altura*1.04,s*.24,0,Math.PI*2);
  ctx.fill();
  // Cabelo / capacete
  ctx.fillStyle="#25313b";
  ctx.fillRect(-s*.22,-altura*1.19,s*.44,s*.13);
  // Arma estilizada
  ctx.fillStyle="#303942";
  ctx.fillRect(s*.16,-altura*.72,s*.66,s*.10);
  ctx.fillStyle="#aeb9c0";
  ctx.fillRect(s*.58,-altura*.75,s*.25,s*.06);
  ctx.restore();

  if(vidaInimigo!==null){
    const largura=Math.max(14,s*.8);
    ctx.fillStyle="#222";
    ctx.fillRect(p.x-largura/2,p.y-s*1.9,largura,4);
    ctx.fillStyle="#ff3434";
    ctx.fillRect(p.x-largura/2,p.y-s*1.9,largura*(vidaInimigo/3),4);
  }
}
function desenhar(){
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#69b9e5");
  grad.addColorStop(.6,"#c6dca0");
  grad.addColorStop(1,"#657e42");
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  // Montanhas distantes
  ctx.fillStyle="#648b87";
  ctx.beginPath();
  ctx.moveTo(0,H*.4);
  for(let x=0;x<=W;x+=W/8){
    ctx.lineTo(x,H*(.22+Math.abs(Math.sin(x*.013))*.13));
  }
  ctx.lineTo(W,H*.45);
  ctx.closePath();
  ctx.fill();

  desenharChao();

  // Objetos decorativos
  const objetos=[];
  for(let x=-40;x<=40;x+=10){
    for(let z=-40;z<=40;z+=10){
      if(Math.abs(x)<5&&Math.abs(z)<5)continue;
      objetos.push({x:x+1,z:z+1,t:0});
    }
  }
  objetos.sort((a,b)=>{
    return Math.hypot(b.x-jogador.x,b.z-jogador.z)-
           Math.hypot(a.x-jogador.x,a.z-jogador.z);
  });
  objetos.forEach(o=>{
    if((Math.abs(o.x)+Math.abs(o.z))%3<1.5)arvore(o.x,o.z);
    else caixa(o.x,o.z,1.4,"#795438");
  });

  // Inimigos e jogador
  let todos=inimigos.map(e=>({e,d:Math.hypot(e.x-jogador.x,e.z-jogador.z)}));
  todos.sort((a,b)=>b.d-a.d);
  todos.forEach(o=>personagem(o.e.x,o.e.z,"#cf4238",0,o.e.vida,o.e.flash));
  personagem(jogador.x,jogador.z,"#00cce8",jogador.ang,null,0);

  // Mira central
  ctx.strokeStyle="#ffffffbb";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(W/2-8,H*.48);ctx.lineTo(W/2+8,H*.48);
  ctx.moveTo(W/2,H*.48-8);ctx.lineTo(W/2,H*.48+8);
  ctx.stroke();
}
function atualizar(dt){
  if(acabou)return;
  const passo=(correndo?7:4)*dt;
  let frente=0,lado=0;
  if(teclas.cima)frente++;
  if(teclas.baixo)frente--;
  if(teclas.esquerda)lado--;
  if(teclas.direita)lado++;

  if(frente||lado){
    const tam=Math.hypot(frente,lado);
    frente/=tam;lado/=tam;
    const dx=Math.sin(jogador.ang)*frente+Math.cos(jogador.ang)*lado;
    const dz=Math.cos(jogador.ang)*frente-Math.sin(jogador.ang)*lado;
    jogador.x=Math.max(-mapa+2,Math.min(mapa-2,jogador.x+dx*passo));
    jogador.z=Math.max(-mapa+2,Math.min(mapa-2,jogador.z+dz*passo));
  }

  // IA: inimigos perseguem o jogador.
  for(const e of inimigos){
    const dx=jogador.x-e.x;
    const dz=jogador.z-e.z;
    const dist=Math.hypot(dx,dz)||1;
    if(dist>1.6){
      e.x+=dx/dist*e.vel*dt;
      e.z+=dz/dist*e.vel*dt;
    }else{
      if(performance.now()-danoTempo>650){
        vida=Math.max(0,vida-5);
        danoTempo=performance.now();
        atualizarHUD();
        if(vida<=0){terminar(false);break;}
      }
    }
    e.flash=Math.max(0,e.flash-dt);
  }
  if(inimigos.length===0)terminar(true);
}
function atacar(){
  if(acabou)return;
  const agora=performance.now();
  if(agora-ultimoAtaque<450)return;
  ultimoAtaque=agora;

  let alvo=-1;
  let menor=4.5;
  for(let i=0;i<inimigos.length;i++){
    const e=inimigos[i];
    const dx=e.x-jogador.x,dz=e.z-jogador.z;
    const dist=Math.hypot(dx,dz);
    if(dist<menor){
      menor=dist;
      alvo=i;
    }
  }
  if(alvo>=0){
    inimigos[alvo].vida--;
    inimigos[alvo].flash=.15;
    if(inimigos[alvo].vida<=0){
      inimigos.splice(alvo,1);
      pontos+=100;
    }
    atualizarHUD();
    if(inimigos.length===0)terminar(true);
  }else{
    ajuda.textContent="Chegue mais perto de um inimigo para atacar!";
  }
}

// Controles que funcionam por toque e mouse.
["cima","baixo","esquerda","direita"].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();
    teclas[id]=true;
    el.setPointerCapture?.(e.pointerId);
  });
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>{
    el.addEventListener(ev,()=>teclas[id]=false);
  });
});
const correrBtn=document.getElementById("pular");
correrBtn.addEventListener("pointerdown",e=>{
  e.preventDefault();correndo=true;
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  correrBtn.addEventListener(ev,()=>correndo=false);
});
document.getElementById("atacar").addEventListener("pointerdown",e=>{
  e.preventDefault();atacar();
});
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="arrowup"||k==="w")teclas.cima=true;
  if(k==="arrowdown"||k==="s")teclas.baixo=true;
  if(k==="arrowleft"||k==="a")teclas.esquerda=true;
  if(k==="arrowright"||k==="d")teclas.direita=true;
  if(k===" ")atacar();
});
addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(k==="arrowup"||k==="w")teclas.cima=false;
  if(k==="arrowdown"||k==="s")teclas.baixo=false;
  if(k==="arrowleft"||k==="a")teclas.esquerda=false;
  if(k==="arrowright"||k==="d")teclas.direita=false;
});
function loop(tempo){
  const dt=Math.min((tempo-ultimoTempo)/1000||0,.05);
  ultimoTempo=tempo;
  atualizar(dt);
  desenhar();
  requestAnimationFrame(loop);
}
iniciar();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
