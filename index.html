
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NexusBlatter</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17251c;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;color:white;z-index:5;text-shadow:1px 2px 3px #000;font-size:14px}
#vidaFundo{width:160px;height:15px;background:#572222;border:2px solid white;border-radius:8px;overflow:hidden;margin-top:5px}
#vida{height:100%;width:100%;background:#29e34e;transition:width .2s}
#mira{position:fixed;left:50%;top:43%;transform:translate(-50%,-50%);color:white;font-size:27px;z-index:4;pointer-events:none;text-shadow:0 0 4px black}
#controles{position:fixed;bottom:18px;left:14px;z-index:8;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:5px}
.ctrl{border:1px solid #ffffff88;border-radius:13px;background:#182b36cc;color:white;font-size:24px;touch-action:none;user-select:none}
#cima{grid-column:2;grid-row:1}#esquerda{grid-column:1;grid-row:2}
#baixo{grid-column:2;grid-row:2}#direita{grid-column:3;grid-row:2}
#acoes{position:fixed;right:16px;bottom:30px;z-index:8;display:flex;flex-direction:column;gap:12px}
#atirar,#correr{width:76px;height:66px;border-radius:18px;background:#a52a22dd;color:white;border:2px solid white;font-weight:bold;font-size:14px;touch-action:none}
#correr{height:48px;background:#225e9cdd}
#mensagem{position:fixed;inset:0;z-index:20;background:#071019d9;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#mensagem h1{font-size:36px;color:#56ff86;margin:0 0 12px}
#mensagem p{line-height:1.6}
#jogar{background:#20b94b;color:white;border:0;padding:16px 26px;border-radius:12px;font-size:18px;font-weight:bold}
#aviso{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);color:white;font-size:10px;z-index:4;white-space:nowrap;text-shadow:1px 1px 2px black}
</style>
</head>
<body>
<div id="hud">
  <b>NEXUSBLATTER</b>
  <div id="vidaFundo"><div id="vida"></div></div>
  <div id="status">Vida: 100 | Pontos: 0</div>
  <div id="inimigosTexto">Inimigos: 8</div>
</div>
<div id="mira">+</div>

<div id="controles">
<button class="ctrl" id="cima">▲</button>
<button class="ctrl" id="esquerda">◀</button>
<button class="ctrl" id="baixo">▼</button>
<button class="ctrl" id="direita">▶</button>
</div>
<div id="acoes">
<button id="atirar">🔫 ATIRAR</button>
<button id="correr">CORRER</button>
</div>
<div id="aviso">Explore o mapa e derrote todos os inimigos!</div>

<div id="mensagem">
<h1>NexusBlatter</h1>
<p>Sobreviva no campo de batalha 3D!<br>
Explore casas, árvores e enfrente 8 inimigos.<br>
Use as setas para andar e ATIRAR para combater.</p>
<button id="jogar">ENTRAR NO JOGO</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const cena = new THREE.Scene();
cena.background = new THREE.Color(0x8cc8e8);
cena.fog = new THREE.Fog(0x8cc8e8, 55, 145);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth/innerHeight, 0.1, 250
);
const render = new THREE.WebGLRenderer({antialias:true});
render.setSize(innerWidth,innerHeight);
render.setPixelRatio(Math.min(devicePixelRatio,1.5));
render.shadowMap.enabled = true;
render.shadowMap.type = THREE.PCFSoftShadowMap;
render.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(render.domElement);

cena.add(new THREE.HemisphereLight(0xffffff,0x52643c,2));
const sol = new THREE.DirectionalLight(0xffffff,2.2);
sol.position.set(-25,45,25);
sol.castShadow = true;
sol.shadow.mapSize.set(1024,1024);
cena.add(sol);

const mat=(cor)=>new THREE.MeshStandardMaterial({color:cor});
const grama=mat(0x548c3d);
const chao=new THREE.Mesh(new THREE.PlaneGeometry(180,180),grama);
chao.rotation.x=-Math.PI/2;
chao.receiveShadow=true;
cena.add(chao);

// Campo de batalha grande
const grade=new THREE.GridHelper(180,60,0x487b35,0x659747);
grade.position.y=0.025;
cena.add(grade);

// Cercas nas bordas
const cercaMat=mat(0x78654b);
for(let i=-90;i<=90;i+=5){
  for(const z of [-90,90]){
    const p=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.3,.3),cercaMat);
    p.position.set(i,.65,z);cena.add(p);
  }
  for(const x of [-90,90]){
    const p=new THREE.Mesh(new THREE.BoxGeometry(.3,1.3,1.2),cercaMat);
    p.position.set(x,.65,i);cena.add(p);
  }
}

// Árvores
const troncoMat=mat(0x714326),folhaMat=mat(0x216b32);
function arvore(x,z){
  const grupo=new THREE.Group();
  const tronco=new THREE.Mesh(
    new THREE.CylinderGeometry(.22,.34,2,7),troncoMat);
  tronco.position.y=1;
  grupo.add(tronco);
  for(let i=0;i<3;i++){
    const copa=new THREE.Mesh(
      new THREE.ConeGeometry(1.25-i*.17,2.1,7),folhaMat);
    copa.position.y=2.2+i*.8;
    grupo.add(copa);
  }
  grupo.position.set(x,0,z);
  grupo.traverse(o=>{if(o.isMesh)o.castShadow=true});
  cena.add(grupo);
}
for(let i=0;i<100;i++){
  const x=Math.random()*150-75,z=Math.random()*150-75;
  if(Math.hypot(x,z)>13)arvore(x,z);
}

// Casas com telhados e portas
const paredes=[0xc9b38a,0xb7b9bc,0xd6c5a0,0x9eafbb];
function casa(x,z){
  const g=new THREE.Group();
  const cor=paredes[Math.floor(Math.random()*paredes.length)];
  const parede=new THREE.Mesh(new THREE.BoxGeometry(7,3.5,6),mat(cor));
  parede.position.y=1.75;g.add(parede);
  const teto=new THREE.Mesh(
    new THREE.ConeGeometry(5.3,2.5,4),mat(0x82412f));
  teto.rotation.y=Math.PI/4;
  teto.position.y=4.5;g.add(teto);
  const porta=new THREE.Mesh(
    new THREE.BoxGeometry(1.15,2,.12),mat(0x57341e));
  porta.position.set(0,1.05,3.06);g.add(porta);
  g.position.set(x,0,z);
  g.traverse(o=>{if(o.isMesh)o.castShadow=true});
  cena.add(g);
}
[[-24,-15],[22,-22],[-35,25],[35,24],[0,-38],[-50,-5],[49,-40],[5,40]]
.forEach(p=>casa(...p));

// Personagem original
const jogador=new THREE.Group();
const roupa=mat(0x197b55),pele=mat(0xd8a477),
      escuro=mat(0x26303b),armaMat=mat(0x222831);
const corpo=new THREE.Mesh(new THREE.CylinderGeometry(.48,.62,1.35,9),roupa);
corpo.position.y=1.45;jogador.add(corpo);
const cabeca=new THREE.Mesh(new THREE.SphereGeometry(.39,12,10),pele);
cabeca.position.y=2.42;jogador.add(cabeca);
const cabelo=new THREE.Mesh(new THREE.SphereGeometry(.4,10,7),escuro);
cabelo.scale.y=.45;cabelo.position.y=2.68;jogador.add(cabelo);
for(const lado of [-.28,.28]){
  const perna=new THREE.Mesh(new THREE.BoxGeometry(.24,.8,.3),escuro);
  perna.position.set(lado,.48,0);jogador.add(perna);
  const braco=new THREE.Mesh(new THREE.BoxGeometry(.23,.85,.25),roupa);
  braco.position.set(lado*2,1.65,.05);jogador.add(braco);
}
const arma=new THREE.Mesh(new THREE.BoxGeometry(.2,.2,1),armaMat);
arma.position.set(.48,1.8,-.48);jogador.add(arma);
jogador.position.set(0,0,0);
jogador.traverse(o=>{if(o.isMesh)o.castShadow=true});
cena.add(jogador);

// Inimigos
const inimigos=[];
const inimigoMat=mat(0x9c3030),inimigoPele=mat(0xb77b59);
function criarInimigo(x,z){
  const g=new THREE.Group();
  const tronco=new THREE.Mesh(
    new THREE.CylinderGeometry(.43,.57,1.3,8),inimigoMat);
  tronco.position.y=1.4;g.add(tronco);
  const cab=new THREE.Mesh(
    new THREE.SphereGeometry(.35,10,8),inimigoPele);
  cab.position.y=2.3;g.add(cab);
  const gun=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.75),armaMat);
  gun.position.set(.4,1.7,-.35);g.add(gun);
  g.position.set(x,0,z);
  g.userData={vida:3,ultimoAtaque:0};
  g.traverse(o=>{if(o.isMesh)o.castShadow=true});
  cena.add(g);inimigos.push(g);
}
for(let i=0;i<8;i++){
  let x,z;
  do{x=Math.random()*55-27;z=Math.random()*55-27}
  while(Math.hypot(x,z)<12);
  criarInimigo(x,z);
}

let vida=100,pontos=0,comecou=false,acabou=false;
let correndo=false,ultimoTiro=0,invulneravel=0;
const teclas={};
const status=document.getElementById('status');
const vidaBarra=document.getElementById('vida');
const textoInimigos=document.getElementById('inimigosTexto');
const tela=document.getElementById('mensagem');
const botaoJogar=document.getElementById('jogar');

function atualizarHUD(){
  vidaBarra.style.width=Math.max(0,vida)+'%';
  vidaBarra.style.background=vida<30?'#ff3434':'#29e34e';
  status.textContent=`Vida: ${Math.ceil(vida)} | Pontos: ${pontos}`;
  textoInimigos.textContent='Inimigos: '+inimigos.length;
}

function finalizar(vitoria){
  if(acabou)return;
  acabou=true;
  tela.style.display='flex';
  tela.innerHTML='';
  const h=document.createElement('h1');
  h.textContent=vitoria?'VITÓRIA!':'FIM DE JOGO';
  h.style.color=vitoria?'#56ff86':'#ff5555';
  const p=document.createElement('p');
  p.textContent=vitoria?
    `Você derrotou todos os inimigos! Pontuação: ${pontos}`:
    `Sua aventura terminou. Pontuação: ${pontos}`;
  const b=document.createElement('button');
  b.id='jogar';b.textContent='JOGAR NOVAMENTE';
  b.onclick=()=>location.reload();
  tela.append(h,p,b);
}

botaoJogar.onclick=()=>{
  comecou=true;tela.style.display='none';
};

// Controles por toque e mouse
function ligarBotao(id,tecla){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();teclas[tecla]=true;
    try{b.setPointerCapture(e.pointerId)}catch(_){}
  });
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])
    b.addEventListener(ev,()=>teclas[tecla]=false);
}
ligarBotao('cima','cima');
ligarBotao('baixo','baixo');
ligarBotao('esquerda','esquerda');
ligarBotao('direita','direita');
ligarBotao('atirar','atirar');
ligarBotao('correr','correr');

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='w'||k==='arrowup')teclas.cima=true;
  if(k==='s'||k==='arrowdown')teclas.baixo=true;
  if(k==='a'||k==='arrowleft')teclas.esquerda=true;
  if(k==='d'||k==='arrowright')teclas.direita=true;
  if(k===' ')teclas.atirar=true;
  if(k==='shift')teclas.correr=true;
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='w'||k==='arrowup')teclas.cima=false;
  if(k==='s'||k==='arrowdown')teclas.baixo=false;
  if(k==='a'||k==='arrowleft')teclas.esquerda=false;
  if(k==='d'||k==='arrowright')teclas.direita=false;
  if(k===' ')teclas.atirar=false;
  if(k==='shift')teclas.correr=false;
});

// Disparo: acerta o inimigo mais próximo à frente
function atirar(){
  const agora=performance.now();
  if(agora-ultimoTiro<420)return;
  ultimoTiro=agora;

  const origem=jogador.position.clone();
  origem.y=1.7;
  const direcao=new THREE.Vector3(0,0,-1);
  direcao.applyQuaternion(jogador.quaternion).normalize();

  let alvo=null,menor=30;
  for(const inimigo of inimigos){
    const delta=inimigo.position.clone().sub(origem);
    const distancia=delta.length();
    if(distancia>30)continue;
    const frente=delta.normalize().dot(direcao);
    if(frente>.88&&distancia<menor){
      menor=distancia;alvo=inimigo;
    }
  }

  // Efeito visual do disparo
  const ponta=origem.clone().add(direcao.clone().multiplyScalar(1.2));
  const bala=new THREE.Mesh(
    new THREE.SphereGeometry(.09,6,6),mat(0xffe76b));
  bala.position.copy(ponta);cena.add(bala);
  setTimeout(()=>cena.remove(bala),100);

  if(alvo){
    alvo.userData.vida--;
    if(alvo.userData.vida<=0){
      cena.remove(alvo);
      inimigos.splice(inimigos.indexOf(alvo),1);
      pontos+=100;
      atualizarHUD();
      if(inimigos.length===0)finalizar(true);
    }else{
      alvo.position.x+=direcao.x*.5;
      alvo.position.z+=direcao.z*.5;
    }
  }
}

// Movimento e câmera
const vetor=new THREE.Vector3();
const direcaoCamera=new THREE.Vector3();
const relogio=new THREE.Clock();
let tempoJogo=0;

function atualizar(dt){
  if(!comecou||acabou)return;
  tempoJogo+=dt;

  const frente=(teclas.cima?1:0)-(teclas.baixo?1:0);
  const lado=(teclas.direita?1:0)-(teclas.esquerda?1:0);
  const mov=new THREE.Vector3(lado,0,-frente);
  const andando=mov.lengthSq()>0;

  if(andando){
    mov.normalize();
    const angulo=Math.atan2(mov.x,-mov.z);
    jogador.rotation.y=angulo;
    const velocidade=(teclas.correr?11:7)*dt;
    jogador.position.x+=mov.x*velocidade;
    jogador.position.z+=mov.z*velocidade;
  }

  // Limites do mapa
  jogador.position.x=THREE.MathUtils.clamp(jogador.position.x,-86,86);
  jogador.position.z=THREE.MathUtils.clamp(jogador.position.z,-86,86);

  // Inimigos perseguem e atacam a curta distância
  for(const inimigo of inimigos){
    const dx=jogador.position.x-inimigo.position.x;
    const dz=jogador.position.z-inimigo.position.z;
    const dist=Math.hypot(dx,dz);
    if(dist>2.1){
      inimigo.position.x+=(dx/dist)*2.6*dt;
      inimigo.position.z+=(dz/dist)*2.6*dt;
      inimigo.rotation.y=Math.atan2(dx,-dz);
    }else if(performance.now()-inimigo.userData.ultimoAtaque>1100){
      inimigo.userData.ultimoAtaque=performance.now();
      if(performance.now()>invulneravel){
        vida-=7;
        invulneravel=performance.now()+250;
        atualizarHUD();
        if(vida<=0){vida=0;atualizarHUD();finalizar(false)}
      }
    }
  }

  if(teclas.atirar)atirar();

  // Câmera acompanha por trás do personagem
  direcaoCamera.set(0,3.8,7.5)
    .applyQuaternion(jogador.quaternion)
    .add(jogador.position);
  camera.position.lerp(direcaoCamera,Math.min(1,dt*5));
  const olhar=jogador.position.clone();
  olhar.y=1.6;
  olhar.add(new THREE.Vector3(0,.3,-1.2)
    .applyQuaternion(jogador.quaternion));
  camera.lookAt(olhar);
}

function animar(){
  requestAnimationFrame(animar);
  const dt=Math.min(relogio.getDelta(),.04);
  atualizar(dt);
  render.render(cena,camera);
}
animar();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  render.setSize(innerWidth,innerHeight);
});
atualizarHUD();
</script>
</body>
</html>
