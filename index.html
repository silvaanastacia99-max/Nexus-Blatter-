
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NexusBlatter</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101c25;font-family:Arial;color:white;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;z-index:5;background:#101c25cc;padding:10px;border-radius:10px;font-size:14px}
#barra{width:155px;height:13px;background:#555;border-radius:8px;overflow:hidden;margin-top:5px}
#vida{height:100%;width:100%;background:#28e34e}
#aviso{position:fixed;top:42%;left:5%;width:90%;text-align:center;font-size:25px;font-weight:bold;text-shadow:2px 2px #000;pointer-events:none;z-index:8}
#reiniciar{display:none;position:fixed;z-index:10;top:57%;left:50%;transform:translateX(-50%);padding:15px 24px;border:0;border-radius:12px;background:#18c95b;color:white;font-weight:bold;font-size:17px}
#controles{position:fixed;bottom:18px;left:15px;display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;gap:5px;z-index:6}
.ctrl{border:1px solid #ffffff88;background:#172a35cc;color:white;border-radius:13px;font-size:23px;touch-action:none}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#acoes{position:fixed;right:18px;bottom:30px;display:flex;flex-direction:column;gap:12px;z-index:6}
.acao{width:76px;height:68px;border-radius:50%;border:2px solid #ffffff99;background:#c52a25dd;color:white;font-size:15px;font-weight:bold;touch-action:none}
#camera{background:#245daadd}
#dica{position:fixed;bottom:3px;left:5px;font-size:10px;color:#ddd;z-index:5}
</style>
</head>
<body>
<div id="hud">
 <b>⚔ NEXUSBLATTER</b>
 <div id="status">Pontos: 0 | Inimigos: 5</div>
 <div id="barra"><div id="vida"></div></div>
 <div id="vidaTexto">Vida: 100</div>
</div>
<div id="aviso"></div>
<button id="reiniciar">JOGAR NOVAMENTE</button>
<div id="controles">
 <button class="ctrl" id="up" data-m="forward">▲</button>
 <button class="ctrl" id="left" data-m="left">◀</button>
 <button class="ctrl" id="down" data-m="back">▼</button>
 <button class="ctrl" id="right" data-m="right">▶</button>
</div>
<div id="acoes">
 <button class="acao" id="atirar">🔥<br>ATIRAR</button>
 <button class="acao" id="camera">↻<br>GIRAR</button>
</div>
<div id="dica">Setas: mover • GIRAR: virar a câmera • ATIRAR: atacar</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87c9ed);
scene.fog = new THREE.Fog(0x87c9ed, 45, 125);

const camera = new THREE.PerspectiveCamera(
 65, innerWidth/innerHeight, 0.1, 300
);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x52643b,2));
const sol = new THREE.DirectionalLight(0xffffff,2.2);
sol.position.set(25,40,20);
sol.castShadow = true;
scene.add(sol);

const material=(color)=>new THREE.MeshStandardMaterial({color});
const verde=material(0x478c42);
const chao=new THREE.Mesh(new THREE.PlaneGeometry(220,220),verde);
chao.rotation.x=-Math.PI/2;
chao.receiveShadow=true;
scene.add(chao);

const grade=new THREE.GridHelper(220,55,0x75a65b,0x75a65b);
grade.position.y=.02;
scene.add(grade);

function caixa(w,h,d,color,x,y,z){
 const obj=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
 obj.position.set(x,y,z);
 obj.castShadow=true;
 obj.receiveShadow=true;
 scene.add(obj);
 return obj;
}
function arvore(x,z){
 caixa(.45,2,.45,0x68432b,x,1,z);
 const copa=new THREE.Mesh(new THREE.SphereGeometry(1.5,8,7),material(0x176b32));
 copa.position.set(x,3,z);
 copa.castShadow=true;
 scene.add(copa);
}
function casa(x,z){
 caixa(7,3.5,6,0xc5a477,x,1.75,z);
 const telhado=new THREE.Mesh(
  new THREE.ConeGeometry(5.3,2.8,4),
  material(0x913c32)
 );
 telhado.position.set(x,4.8,z);
 telhado.rotation.y=Math.PI/4;
 telhado.castShadow=true;
 scene.add(telhado);
 caixa(1.3,2,.12,0x49301d,x,1,z-3.06);
 caixa(1.4,1.1,.15,0x70c9e8,x-2,2,z-3.08);
 caixa(1.4,1.1,.15,0x70c9e8,x+2,2,z-3.08);
}
for(let i=0;i<65;i++){
 let x=(Math.random()-.5)*180;
 let z=(Math.random()-.5)*180;
 if(Math.abs(x)<12&&Math.abs(z)<12)continue;
 arvore(x,z);
}
[[-22,-18],[22,-25],[-32,20],[30,28],[0,-38]].forEach(p=>casa(p[0],p[1]));

const jogador=new THREE.Group();
scene.add(jogador);
const corpo=new THREE.Mesh(
 new THREE.CapsuleGeometry(.55,1.1,4,8),
 material(0x1767dd)
);
corpo.position.y=1.25;
corpo.castShadow=true;
jogador.add(corpo);
const cabeca=new THREE.Mesh(
 new THREE.SphereGeometry(.38,12,10),
 material(0xf0c49b)
);
cabeca.position.y=2.25;
jogador.add(cabeca);
const arma=caixa(.22,.22,1.05,0x222831,0,1.5,0);
arma.parent.remove(arma);
jogador.add(arma);
arma.position.set(.55,1.5,-.65);

const inimigos=[];
function criarInimigo(x,z){
 const g=new THREE.Group();
 const roupa=material(0xb52e2e);
 const c=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1,4,8),roupa);
 c.position.y=1.1;
 c.castShadow=true;
 g.add(c);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.36,10,8),material(0xd7a47b));
 h.position.y=2;
 g.add(h);
 g.position.set(x,0,z);
 scene.add(g);
 inimigos.push({g,vida:3,ataque:0});
}
for(let i=0;i<5;i++){
 let x,z;
 do{
  x=(Math.random()-.5)*90;
  z=(Math.random()-.5)*90;
 }while(Math.hypot(x,z)<18);
 criarInimigo(x,z);
}

const teclas={};
let vida=100,pontos=0,acabou=false;
let direcaoCamera=0,tempoTiro=0,flashAte=0;
const status=document.getElementById('status');
const barra=document.getElementById('vida');
const vidaTexto=document.getElementById('vidaTexto');
const aviso=document.getElementById('aviso');
const reiniciar=document.getElementById('reiniciar');

function atualizarHUD(){
 status.textContent=`Pontos: ${pontos} | Inimigos: ${inimigos.length}`;
 barra.style.width=vida+'%';
 vidaTexto.textContent='Vida: '+Math.ceil(vida);
}
function terminar(vitoria){
 acabou=true;
 aviso.textContent=vitoria?'🏆 VITÓRIA! VOCÊ VENCEU!':'💥 FIM DE JOGO!';
 reiniciar.style.display='block';
}
reiniciar.addEventListener('click',()=>location.reload());

function pressionar(botao,chave){
 const b=document.getElementById(botao);
 const inicio=e=>{e.preventDefault();teclas[chave]=true;};
 const fim=e=>{e.preventDefault();teclas[chave]=false;};
 b.addEventListener('pointerdown',inicio);
 b.addEventListener('pointerup',fim);
 b.addEventListener('pointercancel',fim);
 b.addEventListener('pointerleave',fim);
}
pressionar('up','forward');
pressionar('down','back');
pressionar('left','left');
pressionar('right','right');

addEventListener('keydown',e=>{
 if(['ArrowUp','w','W'].includes(e.key))teclas.forward=true;
 if(['ArrowDown','s','S'].includes(e.key))teclas.back=true;
 if(['ArrowLeft','a','A'].includes(e.key))teclas.left=true;
 if(['ArrowRight','d','D'].includes(e.key))teclas.right=true;
 if(e.code==='Space')atirar();
});
addEventListener('keyup',e=>{
 if(['ArrowUp','w','W'].includes(e.key))teclas.forward=false;
 if(['ArrowDown','s','S'].includes(e.key))teclas.back=false;
 if(['ArrowLeft','a','A'].includes(e.key))teclas.left=false;
 if(['ArrowRight','d','D'].includes(e.key))teclas.right=false;
});
document.getElementById('camera').addEventListener('pointerdown',e=>{
 e.preventDefault();direcaoCamera+=Math.PI/5;
});

function atirar(){
 if(acabou||performance.now()-tempoTiro<350)return;
 tempoTiro=performance.now();
 flashAte=performance.now()+100;
 arma.material.color.set(0xffd447);
 setTimeout(()=>arma.material.color.set(0x222831),110);

 // Mira nos inimigos mais próximos da direção para a qual o jogador olha.
 let alvo=null,melhor=12;
 const frente=new THREE.Vector3(0,0,-1);
 frente.applyQuaternion(jogador.quaternion);
 for(const inimigo of inimigos){
  const delta=inimigo.g.position.clone().sub(jogador.position);
  const distancia=delta.length();
  delta.y=0;
  if(distancia>12||distancia<.1)continue;
  delta.normalize();
  const alinhamento=frente.dot(delta);
  if(alinhamento>.72&&distancia<melhor){
   melhor=distancia;alvo=inimigo;
  }
 }
 if(alvo){
  alvo.vida--;
  alvo.g.scale.setScalar(.92);
  setTimeout(()=>{if(alvo.g.parent)alvo.g.scale.setScalar(1)},90);
  if(alvo.vida<=0){
   scene.remove(alvo.g);
   inimigos.splice(inimigos.indexOf(alvo),1);
   pontos+=100;
   if(inimigos.length===0)terminar(true);
  }
 }else{
  // O tiro não acerta automaticamente inimigos distantes ou atrás do jogador.
 }
 atualizarHUD();
}
document.getElementById('atirar').addEventListener('pointerdown',e=>{
 e.preventDefault();atirar();
});

let ultimo=performance.now();
function animar(agora){
 requestAnimationFrame(animar);
 const dt=Math.min((agora-ultimo)/1000,.04);
 ultimo=agora;
 if(!acabou){
  let mx=0,mz=0;
  if(teclas.forward)mz-=1;
  if(teclas.back)mz+=1;
  if(teclas.left)mx-=1;
  if(teclas.right)mx+=1;
  const comprimento=Math.hypot(mx,mz);
  if(comprimento>0){
   mx/=comprimento;mz/=comprimento;
   const ang=direcaoCamera;
   const dx=mx*Math.cos(ang)+mz*Math.sin(ang);
   const dz=-mx*Math.sin(ang)+mz*Math.cos(ang);
   jogador.position.x+=dx*9*dt;
   jogador.position.z+=dz*9*dt;
   jogador.rotation.y=Math.atan2(-dx,-dz);
  }
  jogador.position.x=THREE.MathUtils.clamp(jogador.position.x,-100,100);
  jogador.position.z=THREE.MathUtils.clamp(jogador.position.z,-100,100);

  for(const inimigo of inimigos){
   const dx=jogador.position.x-inimigo.g.position.x;
   const dz=jogador.position.z-inimigo.g.position.z;
   const d=Math.hypot(dx,dz);
   if(d>1.7&&d<42){
    inimigo.g.position.x+=(dx/d)*2.1*dt;
    inimigo.g.position.z+=(dz/d)*2.1*dt;
    inimigo.g.rotation.y=Math.atan2(-dx,-dz);
   }else if(d<=1.7){
    inimigo.ataque-=dt;
    if(inimigo.ataque<=0){
     vida=Math.max(0,vida-5);
     inimigo.ataque=1.1;
     atualizarHUD();
     if(vida<=0)terminar(false);
    }
   }
  }
 }

 // Câmera de terceira pessoa atrás do personagem.
 const offset=new THREE.Vector3(
  Math.sin(direcaoCamera)*10,6,Math.cos(direcaoCamera)*10
 );
 const destino=jogador.position.clone().add(offset);
 camera.position.lerp(destino,Math.min(1,dt*5));
 const olhar=jogador.position.clone().add(new THREE.Vector3(0,1.4,0));
 camera.lookAt(olhar);
 renderer.render(scene,camera);
}
atualizarHUD();
requestAnimationFrame(animar);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
