
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Jogo 3D</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  background:#080d18;
}
header{
  padding:20;
  text-align:center;
  background:#101b30;
}
header h2{margin:0;color:#39e6ff}
.hero{
  min-height:85;
  padding:35 20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:(ellipse at center,#164c69,#10182c 55%,#080d18);
}
.hero h1{
  font-size:(35,10,60);
  margin:15 0;
  text-shadow:0 0 20 #00cfff;
}
.hero p{line-height:1.6;max-width:450}
.scene{
  height:210;
  width:100;
  max-width:340;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:35;
  perspective:500;
}
.person{
  width:75;
  height:125;
  position:relative;
  transform:(-12);
  filter:(0 0 12 #16dfff);
}
.head{
  width:43;height:43;border-radius:50;
  background:#e0ad83;margin:auto;
  border:3 solid #101827;
}
.body{
  width:62;height:64;margin:auto;
  background:(135,#00d9ff,#164e9e);
  border-radius:15 15 8 8;
  border:2 solid #75f4ff;
}
.legs{
  width:52;height:28;margin:auto;
  background:(90,#18233b 45,#526b91 45);
}
.person.two{transform:(12) (.9);
filter:(0 0 12 #ff654e)}
.person.two .body{
  background:(135,#ff765e,#80254a);
  border-color:#ffb1a4;
}
button{
  border:0;border-radius:10;
  padding:16 25;
  background:#00d9ff;color:#06101d;
  font-size:17;font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 20 #00cfff66;
}
button:active{transform:(.97)}
section{
  padding:45 20;
  text-align:center;
  scroll-margin-top:10;
}
#projeto{background:#101b30}
h2{color:#39e6ff}
.cards{
  display:grid;
  grid-template-columns:(auto-fit,(13,1));
  gap:15;max-width:650;margin:25 auto;
}
.card{
  padding:22 10;
  background:#192942;
  border:1 solid #28516b;
  border-radius:12;
}
.card span{font-size:35}
footer{padding:20;text-align:center;color:#aab8ce}
</style>
</head>
<body>
<header>

    <h1>MISSÃO 3D</h1>
    <p>Entre na aventura! Explore personagens originais e descubra o projeto do nosso jogo.</p>

    <button onclick="document.getElementById('projeto').scrollIntoView({behavior:'smooth'})">
      CONHECER O PROJETO
    </button>
  </div>
