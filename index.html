
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MEU JOGO 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#152c25;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
#hud{position:fixed;top:10px;left:10px;right:10px;z-index:2;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.painel{background:#071b20dd;border:1px solid #4de5e5;border-radius:12px;padding:9px;font-size:13px}
#vidaFundo{width:105px;height:9px;background:#522; border-radius:8px;margin-top:5px;overflow:hidden}
#vidaBarra{height:100%;width:100%;background:#42ed71}
#mensagem{position:fixed;top:83px;left:50%;transform:translateX(-50%);z-index:3;background:#071b20cc;border-radius:10px;padding:8px 12px;font-size:13px;text-align:center;white-space:nowrap}
#controles{position:fixed;bottom:18px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;z-index:4}
#setas{display:grid;grid-template-columns:53px 53px 53px;grid-template-rows:53px 53px;gap:5px}
button{border:1px solid #75f5ff;background:#092d39dd;color:white;border-radius:14px;font-size:23px;font-weight:bold;touch-action:none;user-select:none;-webkit-user-select:none}
button:active{background:#087b8b}
.vazio{visibility:hidden}
#atacar{width:92px;height:92px;border-radius:50%;background:#b52b24e8;border:3px solid #ffb3a0;font-size:15px}
#centro{grid-column:2;grid-row:1}
#esquerda{grid-column:1;grid-row:2}
#baixo{grid-column:2;grid-row:2}
#direita{grid-column:3;grid-row:2}
#inicio{position:fixed;inset:0;z-index:10;background:linear-gradient(#061923dd,#061923f5);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px}
#inicio h1{color:#48f5ff;text-shadow:0 0 16px #00aaff}
#inicio p{max-width:330px;line-height:1.6}
#jogar{padding:16px 30px;background:#00d9f5;color:#06232c;font-size:20px;border-radius:14px}
#reiniciar{position:fixed;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);padding:15px;display:none}
@media(min-width:800px){#controles{left:calc(50% - 350px);right:calc(50% - 350px)}}
</style>
</head>
<body>
<canvas id="jogo"></canvas>

<div id="hud">
  <div class="painel">❤️ Vida: <span id="vida">100</span>
    <div id="vidaFundo"><div id="vidaBarra"></div></div>
  </div>
  <div class="painel">👾 Inimigos: <span id="inimigos">6</span></div>
  <div class="painel">⭐ Pontos: <span id="pontos">0</span></div>
</div>
<div id="mensagem">Explore o mapa e derrote os inimigos!</div>

<div id="controles">
  <div id="setas">
    <button class="vazio"> </button>
    <button id="cima">▲</button>
    <button class="vazio"> </button>
    <button id="esquerda">◀</button>
    <button id="baixo">▼</button>
    <button id="direita">▶</button>
  </div>
  <button id="atacar">⚔️<br>ATACAR</button>
</div>

<div id="inicio">
  <h1>MEU JOGO 3D</h1>
  <p>Explore um mapa grande, mova seu personagem, enfrente inimigos e sobreviva!</p>
  <p>Use as setas para andar e o botão ATACAR quando os inimigos estiverem perto.</p>
  <button id="jogar">ENTRAR NO JOGO</button>
</div>
<button id="reiniciar">JOGAR NOVAMENTE</button>

<script>
(function(){
"use strict";
const canvas=document.getElementById("jogo");
const ctx=canvas.getContext("2d");
if(!ctx){document.getElementById("mensagem").textContent="Seu navegador não suporta o jogo.";return;}

let W=innerWidth,H=innerHeight,dpr=1;
function resize(){
  W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

const mapa={w:2600,h:2600};
let player,enemies,trees,rocks,buildings,keys,vida,pontos,rodando,acabou,ultimoAtaque,tempo;
function distancia(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function aleatorio(a,b){return a+Math.random()*(b-a)}
function criarMundo(){
  player={x:1300,y:1300,r:17,dir:0};
  vida=100;pontos=0;rodando=false;acabou=false;ultimoAtaque=0;tempo=0;
  keys={up:false,down:false,left:false,right:false};
  enemies=[];trees=[];rocks=[];buildings=[];
  for(let i=0;i<6;i++){
    let a=aleatorio(250,2350),b=aleatorio(250,2350);
    enemies.push({x:a,y:b,r:17,hp:2,speed:aleatorio(45,65),hit:0,flash:0});
  }
  for(let i=0;i<95;i++)trees.push({x:aleatorio(50,2550),y:aleatorio(50,2550),r:aleatorio(13,25)});
  for(let i=0;i<42;i++)rocks.push({x:aleatorio(50,2550),y:aleatorio(50,2550),r:aleatorio(8,18)});
  for(let i=0;i<18;i++)buildings.push({x:aleatorio(100,2400),y:aleatorio(100,2400),w:aleatorio(65,125),h:aleatorio(60,105)});
  atualizarHUD();
}
function atualizarHUD(){
  document.getElementById("vida").textContent=Math.max(0,Math.ceil(vida));
  document.getElementById("vidaBarra").style.width=Math.max(0,vida)+"%";
  document.getElementById("inimigos").textContent=enemies?enemies.length:0;
  document.getElementById("pontos").textContent=pontos;
}
function mensagem(t){document.getElementById("mensagem").textContent=t}
function iniciar(){
  criarMundo();rodando=true;
  document.getElementById("inicio").style.display="none";
  document.getElementById("reiniciar").style.display="none";
  mensagem("Encontre os inimigos e ataque de perto!");
}
document.getElementById("jogar").addEventListener("click",iniciar);
document.getElementById("reiniciar").addEventListener("click",iniciar);

function ligarBotao(id,key){
  const b=document.getElementById(id);
  const on=e=>{e.preventDefault();keys[key]=true;};
  const off=e=>{e.preventDefault();keys[key]=false;};
  b.addEventListener("pointerdown",on);
  b.addEventListener("pointerup",off);
  b.addEventListener("pointercancel",off);
  b.addEventListener("pointerleave",off);
}
ligarBotao("cima","up");ligarBotao("baixo","down");
ligarBotao("esquerda","left");ligarBotao("direita","right");
addEventListener("keydown",e=>{
  if(["ArrowUp","w","W"].includes(e.key))keys.up=true;
  if(["ArrowDown","s","S"].includes(e.key))keys.down=true;
  if(["ArrowLeft","a","A"].includes(e.key))keys.left=true;
  if(["ArrowRight","d","D"].includes(e.key))keys.right=true;
  if(e.code==="Space"){e.preventDefault();atacar();}
});
addEventListener("keyup",e=>{
  if(["ArrowUp","w","W"].includes(e.key))keys.up=false;
  if(["ArrowDown","s","S"].includes(e.key))keys.down=false;
  if(["ArrowLeft","a","A"].includes(e.key))keys.left=false;
  if(["ArrowRight","d","D"].includes(e.key))keys.right=false;
});
document.getElementById("atacar").addEventListener("pointerdown",e=>{
  e.preventDefault();atacar();
});

function atacar(){
  if(!rodando||acabou)return;
  if(performance.now()-ultimoAtaque<420)return;
  ultimoAtaque=performance.now();
  let alvo=null,menor=125;
  for(const en of enemies){
    const d=distancia(player,en);
    if(d<menor){menor=d;alvo=en;}
  }
  if(alvo){
    alvo.hp--;alvo.flash=.18;
    if(alvo.hp<=0){
      enemies=enemies.filter(e=>e!==alvo);
      pontos+=100;mensagem("Inimigo derrotado! +100 pontos");
    }else mensagem("Acertou! Continue atacando!");
  }else mensagem("Chegue mais perto do inimigo para atacar.");
  atualizarHUD();
  if(enemies.length===0)finalizar(true);
}

function mover(dt){
  let dx=(keys.right?1:0)-(keys.left?1:0);
  let dy=(keys.down?1:0)-(keys.up?1:0);
  const len=Math.hypot(dx,dy);
  if(len){dx/=len;dy/=len;player.dir=Math.atan2(dy,dx);}
  const speed=190;
  player.x=Math.max(25,Math.min(mapa.w-25,player.x+dx*speed*dt));
  player.y=Math.max(25,Math.min(mapa.h-25,player.y+dy*speed*dt));

  for(const en of enemies){
    const d=distancia(player,en);
    if(d>35){
      en.x+=(player.x-en.x)/d*en.speed*dt;
      en.y+=(player.y-en.y)/d*en.speed*dt;
    }
    if(en.flash>0)en.flash-=dt;
    en.hit-=dt;
    if(d<38&&en.hit<=0){
      vida-=8;en.hit=1.0;
      atualizarHUD();
      mensagem("Cuidado! Um inimigo está atacando!");
      if(vida<=0){vida=0;atualizarHUD();finalizar(false);return;}
    }
  }
}
function finalizar(vitoria){
  rodando=false;acabou=true;
  mensagem(vitoria?"Você venceu! Todos os inimigos foram derrotados!":"Você foi derrotado!");
  const b=document.getElementById("reiniciar");
  b.textContent=vitoria?"JOGAR NOVAMENTE":"TENTAR NOVAMENTE";
  b.style.display="block";
}
function circulo(x,y,r,c){
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function desenhar(){
  ctx.clearRect(0,0,W,H);
  const camX=Math.max(0,Math.min(mapa.w-W,player.x-W/2));
  const camY=Math.max(0,Math.min(mapa.h-H,player.y-H/2));
  ctx.save();ctx.translate(-camX,-camY);

  ctx.fillStyle="#4c8950";ctx.fillRect(camX,camY,W,H);
  // Grama e trilhas
  ctx.strokeStyle="#70985a";ctx.lineWidth=2;
  for(let x=Math.floor(camX/90)*90;x<camX+W+90;x+=90){
    for(let y=Math.floor(camY/90)*90;y<camY+H+90;y+=90){
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+9,y+5);ctx.stroke();
    }
  }
  ctx.fillStyle="#b4a477";
  ctx.fillRect(0,1250,mapa.w,65);
  ctx.fillRect(1250,0,65,mapa.h);
  // Construções
  for(const b of buildings){
    ctx.fillStyle="#34454a";ctx.fillRect(b.x,b.y+12,b.w,b.h);
    ctx.fillStyle="#a9a18a";ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle="#6e7774";ctx.fillRect(b.x+7,b.y+7,b.w-14,b.h-14);
    ctx.fillStyle="#263e4c";ctx.fillRect(b.x+b.w*.4,b.y+b.h*.55,b.w*.22,b.h*.45);
    ctx.fillStyle="#c8d3c9";
    ctx.fillRect(b.x+12,b.y+15,16,13);
    ctx.fillRect(b.x+b.w-28,b.y+15,16,13);
  }
  // Rochas
  for(const r of rocks){
    ctx.fillStyle="#4b514d";ctx.beginPath();
    ctx.ellipse(r.x,r.y,r.r,r.r*.7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#7b827a";ctx.beginPath();
    ctx.ellipse(r.x-3,r.y-3,r.r*.55,r.r*.35,-.3,0,Math.PI*2);ctx.fill();
  }
  // Árvores
  for(const t of trees){
    ctx.fillStyle="#493b2b";ctx.fillRect(t.x-5,t.y-3,10,22);
    circulo(t.x,t.y-9,t.r,"#245c35");
    circulo(t.x-7,t.y-13,t.r*.62,"#347a3d");
    circulo(t.x+7,t.y-7,t.r*.55,"#438b43");
  }
  // Inimigos
  for(const en of enemies){
    circulo(en.x,en.y+7,en.r+3,"#26382b");
    circulo(en.x,en.y,en.r,en.flash>0?"#fff":"#c83d35");
    circulo(en.x,en.y-5,8,"#e8b18a");
    ctx.fillStyle="#211e22";ctx.fillRect(en.x-10,en.y-20,20,4);
    ctx.fillStyle="#ff4d43";ctx.fillRect(en.x-10,en.y-20,20*Math.max(0,en.hp/2),4);
  }
  // Jogador
  circulo(player.x,player.y+8,20,"#26382b");
  circulo(player.x,player.y,player.r,"#1688df");
  circulo(player.x,player.y-6,8,"#f2c49a");
  ctx.strokeStyle="#d8f8ff";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(player.x,player.y);
  ctx.lineTo(player.x+Math.cos(player.dir)*27,player.y+Math.sin(player.dir)*27);
  ctx.stroke();

  ctx.restore();
  // Mini mapa
  const mw=100,mh=100,mx=W-mw-12,my=H>500?75:65;
  ctx.fillStyle="#071b20dd";ctx.fillRect(mx,my,mw,mh);
  ctx.strokeStyle="#6df6ef";ctx.strokeRect(mx,my,mw,mh);
  for(const en of enemies){
    ctx.fillStyle="#ff5149";
    ctx.fillRect(mx+en.x/mapa.w*mw-2,my+en.y/mapa.h*mh-2,4,4);
  }
  ctx.fillStyle="#55f5ff";
  ctx.fillRect(mx+player.x/mapa.w*mw-3,my+player.y/mapa.h*mh-3,6,6);
}
let anterior=0;
function loop(agora){
  const dt=Math.min((agora-anterior)/1000||0,.04);
  anterior=agora;
  if(rodando)mover(dt);
  if(player)desenhar();
  requestAnimationFrame(loop);
}
criarMundo();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
