
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101c25">
<title>NexusBlatter 3D - Anime Battle Royale</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#101c25;color:white;font-family:Arial;
 touch-action:none;
}
canvas{display:block;width:100%;height:100%}
#hud{
 position:fixed;top:9px;left:9px;right:9px;
 z-index:5;display:flex;justify-content:space-between;
 pointer-events:none;gap:8px;
}
.painel{
 background:#101923dd;border:1px solid #ffffff55;
 border-radius:12px;padding:9px;font-size:12px;
}
#barraFundo{
 width:110px;height:11px;background:#555;
 border-radius:20px;overflow:hidden;margin:5px 0;
}
#barraVida{
 height:100%;width:100%;background:#25ed65;
 transition:width .2s;
}
#controles{
 position:fixed;bottom:16px;left:0;right:0;
 z-index:8;display:flex;justify-content:space-between;
 align-items:flex-end;padding:0 15px;
 pointer-events:none;
}
#joystick{
 width:120px;height:120px;border-radius:50%;
 background:#ffffff20;border:2px solid #ffffff80;
 position:relative;pointer-events:auto;
 touch-action:none;
}
#bola{
 width:52px;height:52px;border-radius:50%;
 background:#ffffffbb;border:2px solid white;
 position:absolute;left:32px;top:32px;
 pointer-events:none;
}
#botoes{
 display:flex;gap:8px;align-items:flex-end;
 pointer-events:auto;
}
.btn{
 width:58px;height:58px;border-radius:50%;
 border:2px solid #ffffffaa;
 background:#172d48ee;color:white;
 font-size:20px;font-weight:bold;
 touch-action:none;
}
#atacar{
 width:76px;height:76px;
 background:#d93c45ee;border-color:#ffb0a0;
 font-size:13px;
}
#pular{background:#246d9bee}
#dica{
 position:fixed;right:10px;bottom:105px;
 z-index:5;font-size:10px;opacity:.7;
 pointer-events:none;
}
#mensagem{
 position:fixed;inset:0;z-index:20;
 display:flex;align-items:center;justify-content:center;
 background:#07111bee;padding:14px;
 overflow-y:auto;
}
#caixa{
 width:min(390px,96%);
 max-height:95%;
 overflow-y:auto;
 padding:20px;border-radius:20px;text-align:center;
 background:linear-gradient(145deg,#193b52,#101626);
 border:1px solid #5edaff88;
 box-shadow:0 0 35px #00bfff33;
}
#caixa h1{color:#55e5ff;font-size:25px;margin:5px}
#caixa p{font-size:13px;line-height:1.5;color:#dceaf5}
#seletores{
 display:grid;grid-template-columns:1fr 1fr;
 gap:9px;margin:15px 0;
}
.heroi{
 border:1px solid #ffffff55;border-radius:12px;
 padding:9px;background:#ffffff12;color:white;
 font-size:12px;min-height:72px;
}
.heroi.selecionado{
 border:2px solid #42eaff;
 background:#167a9a55;
}
.heroi strong{display:block;font-size:14px;margin-bottom:5px}
#jogar{
 padding:14px 23px;border:0;border-radius:12px;
 color:#061522;font-weight:bold;font-size:16px;
 background:linear-gradient(90deg,#37e9ff,#42ff9b);
 width:100%;
}
#aviso{
 position:fixed;top:45%;left:50%;
 transform:translate(-50%,-50%);
 z-index:15;background:#142e4aee;
 padding:13px 20px;border-radius:12px;
 display:none;text-align:center;
}
#minimap{
 position:fixed;right:10px;top:100px;
 width:90px;height:90px;border-radius:50%;
 background:#10202dcc;border:1px solid #ffffff66;
 z-index:4;pointer-events:none;
}
</style>
</head>

<body>

<div id="hud">
 <div class="painel">
  <b>NEXUSBLATTER</b><br>
  <span id="personagemNome">Herói: Nexus</span><br>
  <span id="pontos">Pontos: 0</span><br>
  <span id="inimigosTexto">Inimigos: 6</span>
 </div>
 <div class="painel">
  VIDA
  <div id="barraFundo"><div id="barraVida"></div></div>
  <span id="vidaTexto">100 / 100</span>
 </div>
</div>

<canvas id="minimap" width="180" height="180"></canvas>

<div id="dica">Arraste o lado direito para girar a câmera</div>

<div id="controles">
 <div id="joystick"><div id="bola"></div></div>
 <div id="botoes">
  <button class="btn" id="pular">↑</button>
  <button class="btn" id="atacar">ENERGIA</button>
 </div>
</div>

<div id="mensagem">
 <div id="caixa">
  <h1>NEXUSBLATTER</h1>
  <p>ANIME BATTLE ROYALE 3D</p>
  <p>ESCOLHA SEU PERSONAGEM</p>

  <div id="seletores">
   <button class="heroi selecionado" data-heroi="0">
    <strong>⚡ NEXUS</strong>Energia azul
   </button>
   <button class="heroi" data-heroi="1">
    <strong>🔥 AKIRA</strong>Energia de fogo
   </button>
   <button class="heroi" data-heroi="2">
    <strong>❄️ KAI</strong>Energia de gelo
   </button>
   <button class="heroi" data-heroi="3">
    <strong>🌑 REN</strong>Energia sombria
   </button>
  </div>

  <p id="descricao">Guerreiro equilibrado e poderoso.</p>
  <button id="jogar">ENTRAR NO JOGO</button>
 </div>
</div>

<div id="aviso"></div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js';

// CONFIGURAÇÃO

const cena=new THREE.Scene();
cena.background=new THREE.Color(0x8bc5e9);
cena.fog=new THREE.Fog(0x8bc5e9,90,190);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,300
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// LUZES

cena.add(new THREE.HemisphereLight(0xc8eaff,0x52603a,2));

const sol=new THREE.DirectionalLight(0xfff1d1,2.5);
sol.position.set(-30,60,30);
sol.castShadow=true;
sol.shadow.mapSize.set(1024,1024);
cena.add(sol);

// MATERIAIS

function mat(cor,extra={}){
 return new THREE.MeshStandardMaterial({
  color:cor,roughness:.8,...extra
 });
}

const verde=mat(0x438c48);
const madeira=mat(0x71452c);
const folha=mat(0x287b3d);
const pele=mat(0xe5a77d);
const vidro=mat(0x62d8ff,{metalness:.3,roughness:.25});

// CHÃO

const chao=new THREE.Mesh(
 new THREE.PlaneGeometry(190,190),verde
);
chao.rotation.x=-Math.PI/2;
chao.receiveShadow=true;
cena.add(chao);

// ESTRADAS

const estradaMat=mat(0x555b63);

function criarEstrada(x,z,w,d){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,.08,d),estradaMat
 );
 m.position.set(x,.04,z);
 cena.add(m);
}

criarEstrada(0,0,190,9);
criarEstrada(0,0,9,190);

// CASAS

function casa(x,z,cor){

 const g=new THREE.Group();

 const parede=new THREE.Mesh(
  new THREE.BoxGeometry(7,4.5,6),mat(cor)
 );
 parede.position.y=2.25;
 parede.castShadow=true;
 parede.receiveShadow=true;
 g.add(parede);

 const telhado=new THREE.Mesh(
  new THREE.ConeGeometry(5.2,2.8,4),
  mat(0x653b2c)
 );
 telhado.position.y=5.8;
 telhado.rotation.y=Math.PI/4;
 g.add(telhado);

 const porta=new THREE.Mesh(
  new THREE.BoxGeometry(1.2,2.5,.12),mat(0x49301e)
 );
 porta.position.set(0,1.25,3.06);
 g.add(porta);

 const janela=new THREE.Mesh(
  new THREE.BoxGeometry(1.4,1.1,.13),vidro
 );
 janela.position.set(2,2.7,3.08);
 g.add(janela);

 g.position.set(x,0,z);
 cena.add(g);
}

casa(-22,-22,0xd6b47d);
casa(25,-29,0xc48bd8);
casa(-34,28,0xd4d8e2);
casa(35,30,0xd1a46e);
casa(5,47,0x9eb7d5);
casa(-52,-4,0xd6c18c);
casa(55,-50,0xc9a3a0);

// ÁRVORES

function arvore(x,z){

 const g=new THREE.Group();

 const tronco=new THREE.Mesh(
  new THREE.CylinderGeometry(.35,.55,3,8),madeira
 );
 tronco.position.y=1.5;
 g.add(tronco);

 const copa=new THREE.Mesh(
  new THREE.SphereGeometry(2.3,10,8),folha
 );
 copa.position.y=4;
 g.add(copa);

 const copa2=new THREE.Mesh(
  new THREE.SphereGeometry(1.6,8,8),
  mat(0x3a9b48)
 );
 copa2.position.set(.8,4.7,.2);
 g.add(copa2);

 g.position.set(x,0,z);
 cena.add(g);
}

for(let i=0;i<120;i++){
 const x=(Math.random()-.5)*170;
 const z=(Math.random()-.5)*170;
 if(Math.abs(x)<10||Math.abs(z)<10)continue;
 arvore(x,z);
}

// ROCHAS

for(let i=0;i<35;i++){
 const rocha=new THREE.Mesh(
  new THREE.DodecahedronGeometry(1+Math.random()*1.5),
  mat(0x777e78)
 );
 rocha.position.set(
  (Math.random()-.5)*160,.5,
  (Math.random()-.5)*160
 );
 rocha.castShadow=true;
 cena.add(rocha);
}

// PERSONAGENS

const herois=[
 {nome:"Nexus",cabelo:0x172c70,roupa:0x176ac9,poder:0x32efff,descricao:"Guerreiro equilibrado e poderoso.",vel:9},
 {nome:"Akira",cabelo:0xc62b18,roupa:0xb93625,poder:0xff762b,descricao:"Guerreiro veloz com energia de fogo.",vel:10},
 {nome:"Kai",cabelo:0x83dfff,roupa:0x286bb5,poder:0x73eeff,descricao:"Guerreiro de gelo e precisão.",vel:9},
 {nome:"Ren",cabelo:0x231c35,roupa:0x45236d,poder:0xb46aff,descricao:"Guerreiro das sombras.",vel:8.5}
];

function criarPersonagem(cabelo,roupa){

 const g=new THREE.Group();

 const roupaMat=mat(roupa);
 const cabeloMat=mat(cabelo);
 const escuro=mat(0x26334c);

 const corpo=new THREE.Mesh(
  new THREE.CapsuleGeometry(.43,.85,5,10),
  roupaMat
 );
 corpo.position.y=1.5;
 g.add(corpo);

 const cabeca=new THREE.Mesh(
  new THREE.SphereGeometry(.39,16,14),pele
 );
 cabeca.position.y=2.45;
 g.add(cabeca);

 // Cabelo com pontas

 const cabeloBase=new THREE.Mesh(
  new THREE.SphereGeometry(.43,12,10),cabeloMat
 );
 cabeloBase.scale.set(1,.65,1);
 cabeloBase.position.y=2.75;
 g.add(cabeloBase);

 for(let i=0;i<5;i++){
  const ponta=new THREE.Mesh(
   new THREE.ConeGeometry(.17,.55,6),cabeloMat
  );
  ponta.position.set(
   (i-2)*.16,2.98,-.05
  );
  ponta.rotation.z=(i-2)*-.3;
  g.add(ponta);
 }

 // Olhos

 const olhoMat=mat(0x101323);

 for(const s of [-1,1]){
  const olho=new THREE.Mesh(
   new THREE.SphereGeometry(.055,8,8),olhoMat
  );
  olho.position.set(s*.14,2.47,-.34);
  g.add(olho);
 }

 // Braços articulados

 const bracos=[];

 for(const s of [-1,1]){
  const braco=new THREE.Group();

  const membro=new THREE.Mesh(
   new THREE.CapsuleGeometry(.14,.55,4,8),roupaMat
  );
  membro.position.y=-.35;
  braco.add(membro);

  braco.position.set(s*.55,1.9,0);
  g.add(braco);
  bracos.push(braco);
 }

 // Pernas articuladas

 const pernas=[];

 for(const s of [-1,1]){
  const perna=new THREE.Group();

  const membro=new THREE.Mesh(
   new THREE.CapsuleGeometry(.16,.48,4,8),escuro
  );
  membro.position.y=-.3;
  perna.add(membro);

  perna.position.set(s*.23,.95,0);
  g.add(perna);
  pernas.push(perna);
 }

 g.traverse(o=>{
  if(o.isMesh){
   o.castShadow=true;
   o.receiveShadow=true;
  }
 });

 g.userData.bracos=bracos;
 g.userData.pernas=pernas;

 return g;
}

// JOGADOR

let personagemEscolhido=0;

const jogador=criarPersonagem(
 herois[0].cabelo,herois[0].roupa
);
cena.add(jogador);

// INIMIGOS

const inimigos=[];
const cores=[
 0xbd344b,0x7135a8,0x282c43,
 0x9c5a27,0x287a72,0x8d3470
];

function criarInimigos(){

 for(let i=0;i<6;i++){

  const obj=criarPersonagem(0x252039,cores[i]);
  const ang=i*Math.PI/3;

  obj.position.set(
   Math.sin(ang)*30,0,
   Math.cos(ang)*30
  );

  cena.add(obj);

  inimigos.push({
   obj,vida:3,vivo:true,
   velocidade:2.5+Math.random()*1.2,
   proximoAtaque:0,
   fase:Math.random()*6,
   ataqueDistancia:2
  });
 }
}

criarInimigos();

// ESTADO

let pontos=0;
let vida=100;
let acabou=false;
let jogando=false;
let camYaw=0;

let joystickX=0;
let joystickY=0;

let velocidadeX=0;
let velocidadeZ=0;

let pulando=false;
let alturaPulo=0;
let velocidadeVertical=0;

let ultimoTempo=0;
let ultimoDisparo=0;
let tempoJogo=0;

const projeteis=[];

const barra=document.getElementById("barraVida");
const textoVida=document.getElementById("vidaTexto");
const textoPontos=document.getElementById("pontos");
const textoInimigos=document.getElementById("inimigosTexto");
const mensagem=document.getElementById("mensagem");
const aviso=document.getElementById("aviso");

function atualizarHUD(){

 barra.style.width=Math.max(0,vida)+"%";
 textoVida.textContent=Math.max(0,Math.ceil(vida))+" / 100";
 textoPontos.textContent="Pontos: "+pontos;
 textoInimigos.textContent=
 "Inimigos: "+inimigos.filter(e=>e.vivo).length;
}

let avisoTimer;

function mostrarAviso(txt){
 aviso.textContent=txt;
 aviso.style.display="block";
 clearTimeout(avisoTimer);
 avisoTimer=setTimeout(()=>{
  aviso.style.display="none";
 },1100);
}

// SELEÇÃO DE PERSONAGEM

document.querySelectorAll(".heroi").forEach(btn=>{

 btn.addEventListener("click",()=>{

  personagemEscolhido=Number(btn.dataset.heroi);

  document.querySelectorAll(".heroi").forEach(b=>
   b.classList.remove("selecionado")
  );

  btn.classList.add("selecionado");

  document.getElementById("descricao").textContent=
   herois[personagemEscolhido].descricao;
 });
});

function trocarVisual(){

 const h=herois[personagemEscolhido];

 jogador.traverse(o=>{
  if(!o.isMesh)return;

  if(o.material.color){
   const cor=o.material.color.getHex();

   // Atualiza roupas e cabelos pelo modelo selecionado
   if(cor===0x176ac9||cor===0x172c70){
    o.material=mat(h.roupa);
   }
   if(cor===0x172c70){
    o.material=mat(h.cabelo);
   }
  }
 });

 // Reconstrói o personagem para aplicar todas as cores
 const novo=criarPersonagem(h.cabelo,h.roupa);
 novo.position.copy(jogador.position);
 novo.rotation.copy(jogador.rotation);
 cena.remove(jogador);

 jogador.clear();
 jogador.add(...novo.children);
 jogador.userData=novo.userData;
 cena.add(jogador);

 document.getElementById("personagemNome").textContent=
 "Herói: "+h.nome;
}

// COMBATE

let projetilMat=mat(0x32efff,{
 emissive:0x00aaff,emissiveIntensity:2
});

function disparar(){

 if(!jogando||acabou)return;

 const agora=performance.now();
 if(agora-ultimoDisparo<420)return;
 ultimoDisparo=agora;

 let alvo=null;
 let menor=32;

 for(const e of inimigos){
  if(!e.vivo)continue;

  const d=jogador.position.distanceTo(e.obj.position);

  if(d<menor){
   menor=d;
   alvo=e;
  }
 }

 if(!alvo){
  mostrarAviso("Nenhum adversário no alcance!");
  return;
 }

 const cor=herois[personagemEscolhido].poder;

 const bola=new THREE.Mesh(
  new THREE.SphereGeometry(.25,12,10),
  mat(cor,{
   emissive:cor,
   emissiveIntensity:2.5
  })
 );

 bola.position.copy(jogador.position);
 bola.position.y+=1.8;

 cena.add(bola);

 projeteis.push({obj:bola,alvo});
}

// PROJÉTEIS

function atualizarProjeteis(dt){

 for(let i=projeteis.length-1;i>=0;i--){

  const p=projeteis[i];

  if(!p.alvo.vivo){
   cena.remove(p.obj);
   projeteis.splice(i,1);
   continue;
  }

  const destino=p.alvo.obj.position.clone();
  destino.y+=1.4;

  const direcao=destino.clone().sub(p.obj.position);
  const distancia=direcao.length();

  if(distancia<.85){

   p.alvo.vida--;

   if(p.alvo.vida<=0){
    p.alvo.vivo=false;
    p.alvo.obj.visible=false;
    pontos+=100;
    mostrarAviso("Adversário derrotado! +100");
   }else{
    pontos+=20;
   }

   cena.remove(p.obj);
   projeteis.splice(i,1);

   atualizarHUD();

   if(inimigos.every(e=>!e.vivo)){
    finalizar(true);
    return;
   }

   continue;
  }

  direcao.normalize();
  p.obj.position.addScaledVector(direcao,35*dt);
 }
}

// MOVIMENTO DO JOGADOR

const teclas={};

function atualizarJogador(dt){

 const forward=new THREE.Vector3(
  Math.sin(camYaw),0,-Math.cos(camYaw)
 );

 const right=new THREE.Vector3(
  Math.cos(camYaw),0,Math.sin(camYaw)
 );

 const movimento=new THREE.Vector3();

 movimento.addScaledVector(forward,-joystickY);
 movimento.addScaledVector(right,joystickX);

 let tecladoX=0,tecladoY=0;

 if(teclas.w||teclas.arrowup)tecladoY-=1;
 if(teclas.s||teclas.arrowdown)tecladoY+=1;
 if(teclas.a||teclas.arrowleft)tecladoX-=1;
 if(teclas.d||teclas.arrowright)tecladoX+=1;

 movimento.addScaledVector(forward,-tecladoY);
 movimento.addScaledVector(right,tecladoX);

 if(movimento.length()>1)movimento.normalize();

 const h=herois[personagemEscolhido];
 const velocidade=h.vel;

 const destinoX=movimento.x*velocidade;
 const destinoZ=movimento.z*velocidade;

 const suavidade=Math.min(1,dt*10);

 velocidadeX=THREE.MathUtils.lerp(
  velocidadeX,destinoX,suavidade
 );

 velocidadeZ=THREE.MathUtils.lerp(
  velocidadeZ,destinoZ,suavidade
 );

 jogador.position.x+=velocidadeX*dt;
 jogador.position.z+=velocidadeZ*dt;

 jogador.position.x=THREE.MathUtils.clamp(
  jogador.position.x,-87,87
 );
 jogador.position.z=THREE.MathUtils.clamp(
  jogador.position.z,-87,87
 );

 const andando=movimento.length()>.1;

 if(andando){
  jogador.rotation.y=Math.atan2(-movimento.x,-movimento.z);
 }

 // ANIMAÇÃO DE ANDAR

 const passo=andando?Math.sin(tempoJogo*10)*.55:0;

 jogador.userData.pernas?.forEach((p,i)=>{
  p.rotation.x=i===0?passo:-passo;
 });

 jogador.userData.bracos?.forEach((b,i)=>{
  b.rotation.x=i===0?-passo:passo;
 });

 // PULO

 if(pulando){

  velocidadeVertical-=20*dt;
  alturaPulo+=velocidadeVertical*dt;

  if(alturaPulo<=0){
   alturaPulo=0;
   velocidadeVertical=0;
   pulando=false;
  }
 }

 jogador.position.y=alturaPulo;
}

// INTELIGÊNCIA DOS INIMIGOS

function atualizarInimigos(dt){

 const agora=performance.now()/1000;

 inimigos.forEach(e=>{

  if(!e.vivo)return;

  const obj=e.obj;

  const dx=jogador.position.x-obj.position.x;
  const dz=jogador.position.z-obj.position.z;

  const dist=Math.sqrt(dx*dx+dz*dz);

  if(dist>e.ataqueDistancia){

   // Aproximação com leve movimento lateral
   const lado=Math.sin(tempoJogo*1.8+e.fase)*.25;

   const nx=dx/dist;
   const nz=dz/dist;

   obj.position.x+=(nx-lado*nz)*e.velocidade*dt;
   obj.position.z+=(nz+lado*nx)*e.velocidade*dt;

   obj.rotation.y=Math.atan2(-dx,-dz);

  }else if(agora>e.proximoAtaque){

   vida=Math.max(0,vida-5);
   e.proximoAtaque=agora+1.7;

   atualizarHUD();
   mostrarAviso("Você recebeu um ataque!");

   if(vida<=0)finalizar(false);
  }

  // Animação dos adversários
  const andando=dist>e.ataqueDistancia;

  obj.userData.pernas?.forEach((p,i)=>{
   const passo=andando?
    Math.sin(tempoJogo*8+e.fase)*.45:0;
   p.rotation.x=i===0?passo:-passo;
  });

 });
}

// CÂMERA

function atualizarCamera(dt){

 const distancia=7.5;
 const altura=4;

 const alvo=new THREE.Vector3(
  jogador.position.x-Math.sin(camYaw)*distancia,
  jogador.position.y+altura,
  jogador.position.z+Math.cos(camYaw)*distancia
 );

 camera.position.lerp(alvo,Math.min(1,dt*5));

 camera.lookAt(
  jogador.position.x,
  jogador.position.y+1.6,
  jogador.position.z
 );
}

// MINIMAPA

function desenharMinimapa(){

 const canvas=document.getElementById("minimap");
 const ctx=canvas.getContext("2d");

 ctx.clearRect(0,0,180,180);

 ctx.fillStyle="#284b35";
 ctx.fillRect(0,0,180,180);

 ctx.strokeStyle="#777";
 ctx.lineWidth=9;
 ctx.beginPath();
 ctx.moveTo(90,0);
 ctx.lineTo(90,180);
 ctx.moveTo(0,90);
 ctx.lineTo(180,90);
 ctx.stroke();

 function ponto(x,z,cor,tamanho){
  ctx.fillStyle=cor;
  ctx.beginPath();
  ctx.arc(90+x,90+z,tamanho,0,Math.PI*2);
  ctx.fill();
 }

 inimigos.forEach(e=>{
  if(!e.vivo)return;
  ponto(
   (e.obj.position.x-jogador.position.x)*.8,
   (e.obj.position.z-jogador.position.z)*.8,
   "#ff4444",5
  );
 });

 ponto(0,0,"#42efff",6);
}

// JOYSTICK

const joystick=document.getElementById("joystick");
const bola=document.getElementById("bola");

let toqueJoystick=null;

function moverJoystick(e){

 const r=joystick.getBoundingClientRect();

 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);

 const max=35;
 const dist=Math.sqrt(dx*dx+dy*dy);

 if(dist>max){
  dx=dx/dist*max;
  dy=dy/dist*max;
 }

 joystickX=dx/max;
 joystickY=dy/max;

 bola.style.transform=`translate(${dx}px,${dy}px)`;
}

joystick.addEventListener("pointerdown",e=>{
 e.preventDefault();
 toqueJoystick=e.pointerId;
 joystick.setPointerCapture(e.pointerId);
 moverJoystick(e);
});

joystick.addEventListener("pointermove",e=>{
 if(e.pointerId===toqueJoystick)moverJoystick(e);
});

function soltarJoystick(){
 toqueJoystick=null;
 joystickX=0;
 joystickY=0;
 bola.style.transform="translate(0,0)";
}

joystick.addEventListener("pointerup",soltarJoystick);
joystick.addEventListener("pointercancel",soltarJoystick);

// CÂMERA PELO TOQUE

let toqueCamera=null;
let ultimaX=0;

renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.clientX>innerWidth*.45){
  toqueCamera=e.pointerId;
  ultimaX=e.clientX;
  renderer.domElement.setPointerCapture(e.pointerId);
 }
});

renderer.domElement.addEventListener("pointermove",e=>{
 if(e.pointerId===toqueCamera){
  const dx=e.clientX-ultimaX;
  camYaw-=dx*.003;
  ultimaX=e.clientX;
 }
});

renderer.domElement.addEventListener("pointerup",()=>{
 toqueCamera=null;
});

renderer.domElement.addEventListener("pointercancel",()=>{
 toqueCamera=null;
});

// BOTÕES

document.getElementById("atacar").addEventListener(
 "pointerdown",e=>{
  e.preventDefault();
  disparar();
 }
);

document.getElementById("pular").addEventListener(
 "pointerdown",e=>{

);

// TECLADO

window.addEventListener("keydown",e=>{
 teclas[e.key.toLowerCase()]=true;

 if(e.key===" "&&!pulando&&jogando){

 if(e.key.toLowerCase()==="f")disparar();
});

window.addEventListener("keyup",e=>{

});

function finalizar(vitoria){

 if(acabou)return;

 acabou=true;
 jogando=false;

 mensagem.style.display="flex";

 document.getElementById("caixa").innerHTML=

 vitoria?
 `<h1>🏆 VITÓRIA!</h1>
 <p>Você venceu a batalha!</p>
 <p>Pontuação: ${pontos}</p>
 <button id="jogar">JOGAR NOVAMENTE</button>`:

 <button id="jogar">JOGAR NOVAMENTE</button>`;

 document.getElementById("jogar").onclick=reiniciar;

// REINICIAR

function reiniciar(){

 pontos=0;
 vida=100;
 acabou=false;
 jogando=true;

 camYaw=0;
 tempoJogo=0;

 joystickX=0;
 joystickY=0;
 velocidadeX=0;
 velocidadeZ=0;

 pulando=false;
 alturaPulo=0;
 velocidadeVertical=0;

 jogador.position.set(0,0,0);
 jogador.rotation.set(0,0,0);

 inimigos.forEach((e,i)=>{

  const a=i*Math.PI/3;

  e.obj.position.set(
   Math.sin(a)*30,0,
   Math.cos(a)*30
  );

  e.vida=3;
  e.vivo=true;
  e.obj.visible=true;
  e.proximoAtaque=0;
 });

 projeteis.forEach(p=>cena.remove(p.obj));
 projeteis.length=0;

 bola.style.transform="translate(0,0)";
 mensagem.style.display="none";

 atualizarHUD();
}

// INICIAR

document.getElementById("jogar").onclick=()=>{

 trocarVisual();
 reiniciar();
};

// ANIMAÇÃO

function animar(tempo){

 requestAnimationFrame(animar);

 const dt=ultimoTempo?
  Math.min((tempo-ultimoTempo)/1000,.04):0;

 ultimoTempo=tempo;

 if(jogando&&!acabou){

  tempoJogo+=dt;

  atualizarJogador(dt);
  atualizarInimigos(dt);
  atualizarProjeteis(dt);
  desenharMinimapa();
 }

 atualizarCamera(dt);
 renderer.render(cena,camera);
}

requestAnimationFrame(animar);

// REDIMENSIONAMENTO

window.addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
});

atualizarHUD();

</script>
