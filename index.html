
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NexusBlatter 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87c5e8;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;z-index:2;background:#10202ddd;color:white;padding:12px;border-radius:12px;font-size:14px}
#bar{width:130px;height:9px;background:#612626;margin-top:6px;border-radius:8px;overflow:hidden}
#life{height:100%;width:100%;background:#35ec73}
#message{position:fixed;top:25%;left:0;right:0;text-align:center;color:white;font-size:24px;font-weight:bold;text-shadow:0 2px 5px black;z-index:3;pointer-events:none}
#controls{position:fixed;bottom:14px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;z-index:4}
.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px}
button{border:1px solid #ffffff99;background:#18354ddd;color:white;border-radius:12px;font-weight:bold;touch-action:none}
.pad button{font-size:22px}
.empty{visibility:hidden}
.actions{display:flex;flex-direction:column;gap:10px}
.actions button{width:76px;height:58px;font-size:13px}
#start{position:fixed;inset:0;z-index:10;background:linear-gradient(#102b45ee,#07121eee);color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}
#start h1{color:#00eaff;font-size:34px;text-shadow:0 0 15px #00bfff}
#play{padding:16px 28px;background:#00dced;color:#052435;font-size:19px}
#hint{font-size:13px;line-height:1.6;max-width:300px}
</style>
</head>
<body>
<div id="hud">
<b>NEXUSBLATTER 3D</b>
<div id="stats">❤️ Vida: 100</div>
<div id="bar"><div id="life"></div></div>
<div id="score">Eliminações: 0</div>
<div id="left">Inimigos: 8</div>
</div>
<div id="message"></div>
<div id="controls">
<div class="pad">
<button class="empty"></button><button data-key="forward">▲</button><button class="empty"></button>
<button data-key="left">◀</button><button data-key="back">▼</button><button data-key="right">▶</button>
<button class="empty"></button><button data-key="run">⚡</button><button class="empty"></button>
</div>
<div class="actions">
<button id="turn">GIRAR ↻</button>
<button id="fire" style="background:#a32c25">🔥 ATIRAR</button>
</div>
</div>
<div id="start">
<h1>NEXUSBLATTER</h1>
<p>BATALHA 3D • MAPA ABERTO</p>
<p>Explore, lute contra os inimigos e sobreviva!</p>
<p id="hint">Setas: movimentar. ⚡: correr. GIRAR: virar a câmera. ATIRAR: atacar.</p>
<button id="play">ENTRAR NO JOGO</button>
<p id="load">Preparando o mundo 3D...</p>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8bc9ed);
scene.fog=new THREE.Fog(0x8bc9ed,60,150);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe2f6ff,0x52633d,2));
const sun=new THREE.DirectionalLight(0xfff0d0,2.4);
sun.position.set(-30,50,25);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});
const solid=[];
function cube(w,h,d,color,x,y,z,block=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 scene.add(m);
 if(block)solid.push({x,z,rx:w/2+.5,rz:d/2+.5});
 return m;
}
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(180,180),mat(0x659849));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// Estradas do mapa
cube(10,.04,180,0x555b59,0,.03,0,false);
cube(180,.04,9,0x555b59,0,.04,0,false);
for(let i=-80;i<85;i+=8){
 cube(.15,.05,3,0xf1dfa1,0,.07,i,false);
 cube(3,.05,.15,0xf1dfa1,i,.08,0,false);
}

// Casas com telhado e janelas
function house(x,z){
 cube(7,3.5,7,0xc9b58c,x,1.75,z);
 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(6,2.5,4),mat(0x804b3c));
 roof.position.set(x,4.7,z);roof.rotation.y=Math.PI/4;
 roof.castShadow=true;scene.add(roof);
 cube(1.2,2,.15,0x4b3024,x,1,z+3.55,false);
 for(const side of [-1,1])
  cube(1.1,1,.12,0x74d9ed,x+side*2,2,z+3.56,false);
}
for(let i=0;i<15;i++){
 let x=(i%5-2)*25+(i%2?3:-3);
 let z=(Math.floor(i/5)-2)*25;
 house(x,z);
}

// Árvores
function tree(x,z){
 const group=new THREE.Group();
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.4,2.5,7),mat(0x67442b));
 trunk.position.y=1.25;trunk.castShadow=true;group.add(trunk);
 const crown=new THREE.Mesh(
  new THREE.ConeGeometry(1.6,4,8),mat(0x286a35));
 crown.position.y=3.8;crown.castShadow=true;group.add(crown);
 group.position.set(x,0,z);scene.add(group);
 solid.push({x,z,rx:.7,rz:.7});
}
for(let i=0;i<100;i++){
 let x=Math.random()*145-72,z=Math.random()*145-72;
 if(Math.abs(x)<8||Math.abs(z)<7)continue;
 if(solid.some(o=>Math.abs(o.x-x)<5&&Math.abs(o.z-z)<5))continue;
 tree(x,z);
}

// Personagens 3D originais
function character(color,enemy=false){
 const g=new THREE.Group();
 function part(w,h,d,c,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));
  m.position.set(x,y,z);m.castShadow=true;g.add(m);return m;
 }
 part(.8,1,.45,color,0,1.45,0);
 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.3,12,10),mat(0xd9a17b));
 head.position.y=2.2;head.castShadow=true;g.add(head);
 part(.24,.7,.27,0x253044,-.23,.65,0);
 part(.24,.7,.27,0x253044,.23,.65,0);
 part(.22,.8,.24,color,-.53,1.5,0);
 part(.22,.8,.24,color,.53,1.5,0);
 if(!enemy)part(.18,.17,.9,0x222b33,.4,1.45,-.55);
 scene.add(g);
 return g;
}
const player=character(0x12a8db);
player.position.set(0,0,5);
const enemies=[];
for(let i=0;i<8;i++){
 const e=character(i%2?0xc43c37:0xd77b35,true);
 let x,z,tries=0;
 do{
  x=Math.random()*100-50;z=Math.random()*100-50;tries++;
 }while(tries<100&&(Math.hypot(x,z)<18||
 solid.some(o=>Math.abs(o.x-x)<3&&Math.abs(o.z-z)<3)));
 e.position.set(x,0,z);
 e.userData={hp:3,attack:0,phase:Math.random()*6};
 enemies.push(e);
}

const keys={};
let health=100,kills=0,playing=false,ended=false;
let angle=0,lastShot=0,lastDamage=0;
const clock=new THREE.Clock();

function blocked(x,z){
 return solid.some(o=>Math.abs(x-o.x)<o.rx&&Math.abs(z-o.z)<o.rz);
}
function move(obj,dx,dz){
 const nx=obj.position.x+dx,nz=obj.position.z+dz;
 if(Math.abs(nx)<84&&!blocked(nx,obj.position.z))obj.position.x=nx;
 if(Math.abs(nz)<84&&!blocked(obj.position.x,nz))obj.position.z=nz;
}
function updateHUD(){
 $('stats').textContent='❤️ Vida: '+Math.max(0,Math.ceil(health));
 $('life').style.width=Math.max(0,health)+'%';
 $('score').textContent='Eliminações: '+kills;
 $('left').textContent='Inimigos: '+enemies.length;
}
function finish(win){
 if(ended)return;
 ended=true;playing=false;
 $('message').textContent=win?'🏆 VITÓRIA!':'FIM DE JOGO';
 $('start').style.display='flex';
 $('start').querySelector('h1').textContent=win?'VOCÊ VENCEU!':'FIM DE JOGO';
 $('start').querySelector('p').textContent=
  'Eliminações: '+kills+' de 8';
 $('play').textContent='JOGAR NOVAMENTE';
}
function shoot(){
 if(!playing||ended)return;
 const now=performance.now();
 if(now-lastShot<400)return;
 lastShot=now;
 const forward=new THREE.Vector3(
  -Math.sin(player.rotation.y),0,-Math.cos(player.rotation.y));
 let target=null,best=25;
 for(const e of enemies){
  const diff=e.position.clone().sub(player.position);
  const distance=diff.length();
  if(distance>best)continue;
  diff.y=0;diff.normalize();
  if(forward.dot(diff)>.65){best=distance;target=e;}
 }
 if(target){
  target.userData.hp--;
  target.children.forEach(p=>{
   if(p.material&&p.material.color)p.material.emissive?.setHex(0x551111);
  });
  if(target.userData.hp<=0){
   scene.remove(target);
   enemies.splice(enemies.indexOf(target),1);
   kills++;updateHUD();
   if(enemies.length===0)finish(true);
  }
 }
}
$('fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});
$('turn').addEventListener('pointerdown',e=>{e.preventDefault();angle+=.7});
document.querySelectorAll('[data-key]').forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();keys[k]=true;
  try{b.setPointerCapture(e.pointerId)}catch(_){}
 });
 const stop=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener('pointerup',stop);
 b.addEventListener('pointercancel',stop);
 b.addEventListener('lostpointercapture',()=>keys[k]=false);
});
window.addEventListener('keydown',e=>{
 const map={ArrowUp:'forward',w:'forward',ArrowDown:'back',s:'back',
 ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',Shift:'run',' ':'fire'};
 const k=map[e.key];
 if(k){e.preventDefault();if(k==='fire')shoot();else keys[k]=true}
});
window.addEventListener('keyup',e=>{
 const map={ArrowUp:'forward',w:'forward',ArrowDown:'back',s:'back',
 ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',Shift:'run'};
 if(map[e.key])keys[map[e.key]]=false;
});

function start(){
 if(playing)return;
 if(ended)location.reload();
 playing=true;ended=false;
 $('start').style.display='none';
 $('message').textContent='';
 clock.getDelta();
}
$('play').addEventListener('click',start);

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 if(playing&&!ended){
  let forward=(keys.forward?1:0)-(keys.back?1:0);
  let side=(keys.right?1:0)-(keys.left?1:0);
  const speed=keys.run?9:5;
  const dx=(-Math.sin(angle)*forward+Math.cos(angle)*side)*speed*dt;
  const dz=(-Math.cos(angle)*forward-Math.sin(angle)*side)*speed*dt;
  move(player,dx,dz);
  if(forward||side)player.rotation.y=angle;
  for(const e of enemies){
   const dx=player.position.x-e.position.x;
   const dz=player.position.z-e.position.z;
   const dist=Math.hypot(dx,dz);
   if(dist>1.5){
    const speedEnemy=dist>9?2.0:1.1;
    move(e,dx/dist*speedEnemy*dt,dz/dist*speedEnemy*dt);
    e.rotation.y=Math.atan2(-dx,-dz);
   }else if(performance.now()-lastDamage>800){
    health-=5;lastDamage=performance.now();updateHUD();
    if(health<=0){finish(false);break}
   }
  }
 }
 const behind=new THREE.Vector3(
  Math.sin(angle)*7,4.2,Math.cos(angle)*7);
 camera.position.copy(player.position).add(behind);
 camera.lookAt(player.position.x,player.position.y+1.3,player.position.z);
 renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
$('load').textContent='Mundo 3D pronto!';
updateHUD();
animate();
</script>
</body>
</html>
